function loadData(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      DATA = JSON.parse(raw);
      return true;
    }
  }catch(e){ console.warn('读取本地数据失败',e); }
  // 加载示例数据
  DATA = JSON.parse(JSON.stringify(SAMPLE_DATA));
  saveData();
  return false;
}

function saveData(){
  DATA.meta.lastUpdate = new Date().toLocaleString('zh-CN');
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(DATA));
    updateStatusbar();
  }catch(e){ alert('保存失败：'+e.message); }
}

function updateStatusbar(){
  const sb = document.getElementById('statusbar');
  if(DATA && DATA.meta){
    sb.textContent = '数据版本 v' + DATA.meta.version + ' · 更新于 ' + DATA.meta.lastUpdate + ' · 本地存储';
  }
}

function renderWeights(){
  const list = $('weightList');
  let h = '';
  DATA.metrics.forEach((m,idx) => {
    h += '<div class="weight-item">';
    h += '<input type="checkbox" ' + (m.enabled?'checked':'') + ' onchange="toggleMetric('+idx+')">';
    h += '<span class="w-name" title="'+esc(m.desc||'')+'">'+esc(m.name)+'</span>';
    h += '<input type="number" min="0" max="100" value="'+m.weight+'" ' +
         'onchange="updateWeight('+idx+',this.value)" ' + (m.enabled?'':'disabled') + '>';
    h += '<span class="w-pct">%</span>';
    h += '</div>';
  });
  list.innerHTML = h;
  updateWeightTotal();
}

function toggleMetric(idx){
  DATA.metrics[idx].enabled = !DATA.metrics[idx].enabled;
  normalizeWeights();
  saveData();
  renderWeights();
  renderTutorList();
  renderScorePanel();
}

function updateWeight(idx, val){
  const v = Math.max(0, Math.min(100, parseInt(val)||0));
  DATA.metrics[idx].weight = v;
  normalizeWeights();
  saveData();
  renderWeights();
  renderTutorList();
  renderScorePanel();
}

function normalizeWeights(){
  const enabled = DATA.metrics.filter(m=>m.enabled);
  if(enabled.length===0) return;
  const total = enabled.reduce((s,m)=>s+m.weight,0);
  if(total===0){
    const avg = Math.floor(100/enabled.length);
    let rem = 100 - avg*enabled.length;
    enabled.forEach((m,i)=>{ m.weight = avg + (i<rem?1:0); });
  }
}

function updateWeightTotal(){
  const total = DATA.metrics.filter(m=>m.enabled).reduce((s,m)=>s+m.weight,0);
  const el = $('weightTotal');
  el.textContent = total + '%';
  el.style.color = total===100 ? '#10b981' : '#ef4444';
}

function resetWeights(){
  const enabled = DATA.metrics.filter(m=>m.enabled);
  if(enabled.length===0){ alert('请至少启用一项指标'); return; }
  const avg = Math.floor(100/enabled.length);
  let rem = 100 - avg*enabled.length;
  DATA.metrics.forEach(m=>{
    if(m.enabled){
      m.weight = avg + (rem>0?1:0);
      if(rem>0) rem--;
    }
  });
  saveData();
  renderWeights();
  renderTutorList();
  renderScorePanel();
}

function calcTutorScore(tutor){
  const enabled = DATA.metrics.filter(m=>m.enabled);
  if(enabled.length===0) return 0;
  const scores = tutor.scores || {};
  let total = 0, weightSum = 0;
  enabled.forEach(m=>{
    const s = scores[m.id];
    if(s!==undefined && s!==null && s!==''){
      total += (parseFloat(s) || 0) * m.weight;
      weightSum += m.weight;
    }
  });
  return weightSum>0 ? Math.round(total/weightSum*10)/10 : 0;
}

function renderTutorList(){
  const search = $('tutorSearch').value.trim().toLowerCase();
  // 排序
  let list = DATA.tutors.filter(t=>{
    if(search && t.name.toLowerCase().indexOf(search)<0) return false;
    if(currentGradeFilter!=='all' && t.grade!==currentGradeFilter) return false;
    return true;
  }).map(t=>({...t, _score:calcTutorScore(t)}))
    .sort((a,b)=>b._score-a._score);

  // 等级筛选标签
  const grades = ['all','S','A','B','C'];
  const gradeNames = {all:'全部',S:'S级',A:'A级',B:'B级',C:'C级'};
  let fh = '';
  grades.forEach(g=>{
    fh += '<span class="filter-tag'+(currentGradeFilter===g?' active':'')+'" onclick="filterGrade(\''+g+'\')">'+gradeNames[g]+'</span>';
  });
  $('gradeFilters').innerHTML = fh;

  $('tutorCount').textContent = '（共'+list.length+'人）';

  let h = '';
  if(list.length===0){
    h = '<div style="text-align:center;color:#94a3b8;padding:30px">未找到匹配导师</div>';
  }else{
    list.forEach((t,i)=>{
      h += '<div class="tutor-card'+(selectedTutorId===t.id?' active':'')+'" onclick="selectTutor('+t.id+')">';
      const rankClass = i===0?'top1':i===1?'top2':i===2?'top3':'';
      h += '<span class="rank '+rankClass+'">'+(i+1)+'</span>';
      if(t.grade) h += '<span class="badge grade-'+t.grade+'">'+t.grade+'</span>';
      h += '<span class="tutor-name">'+esc(t.name)+'</span>';
      h += '<span class="tutor-inst">'+esc(t.institute||'')+'</span>';
      h += '<span class="tutor-score">'+t._score+'</span>';
      if(t.reason) h += '<div class="tutor-reason">'+esc(t.reason)+'</div>';
      h += '</div>';
    });
  }
  $('tutorList').innerHTML = h;
}

// ---- CSV导入导出 ----
function exportTutorsCSV(){
  const headers = ['导师姓名','所属所','等级','导师定位','学硕名额','专硕名额','合计','评级理由'];
  let csv = '\ufeff' + headers.join(',') + '\n';
  DATA.tutors.forEach(t=>{
    const row = [t.name,t.institute||'',t.grade||'',t.role||'',t.xueShuo||0,t.zhuanShuo||0,t.total||0,t.reason||''];
    csv += row.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',') + '\n';
  });
  downloadFile(csv, '导师名单.csv', 'text/csv');
}

function importTutorsCSV(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const text = ev.target.result;
    // 处理BOM
    const content = text.charCodeAt(0)===0xFEFF ? text.slice(1) : text;
    const lines = content.split(/\r?\n/).filter(l=>l.trim());
    if(lines.length<2){ alert('CSV文件内容不足'); return; }
    const headers = parseCSVLine(lines[0]);
    // 自动匹配列
    function findCol(cands){
      for(const c of cands){
        for(let i=0;i<headers.length;i++){
          if(headers[i].includes(c)||c.includes(headers[i])) return i;
        }
      }
      return -1;
    }
    const nameI = findCol(['导师姓名','姓名','导师']);
    const instI = findCol(['所属所','所','学院']);
    const gradeI = findCol(['等级','评级','SABC']);
    const roleI = findCol(['导师定位','定位','职称']);
    const xsI = findCol(['学硕名额','学硕','学']);
    const zsI = findCol(['专硕名额','专硕','专']);
    const reasonI = findCol(['评级理由','理由','评价','方向']);
    if(nameI<0){ alert('找不到姓名列'); return; }

    const mode = confirm('点击"确定"=追加导入（保留现有导师）\n点击"取消"=完全替换（清空原有数据）');
    const newTutors = [];
    for(let i=1;i<lines.length;i++){
      const cols = parseCSVLine(lines[i]);
      if(!cols[nameI]?.trim()) continue;
      const xs = parseInt(cols[xsI])||0;
      const zs = parseInt(cols[zsI])||0;
      newTutors.push({
        id: genId(),
        name: cols[nameI].trim(),
        institute: instI>=0?(cols[instI]||'').trim():'',
        grade: gradeI>=0?(cols[gradeI]||'').trim():'',
        role: roleI>=0?(cols[roleI]||'').trim():'',
        xueShuo: xs, zhuanShuo: zs, total: xs+zs,
        reason: reasonI>=0?(cols[reasonI]||'').trim():'',
        scores: {}
      });
    }
    if(mode){
      DATA.tutors = DATA.tutors.concat(newTutors);
    }else{
      DATA.tutors = newTutors;
    }
    saveData();
    renderAdminTutors($('adminContent'));
    alert('导入成功！共导入 '+newTutors.length+' 位导师');
    e.target.value = '';
  };
  reader.readAsText(file, 'UTF-8');
}

function parseCSVLine(line){
  const result = []; let cur = ''; let inQ = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(inQ){
      if(ch==='"'){
        if(line[i+1]==='"'){ cur+='"'; i++; }
        else inQ = false;
      }else cur+=ch;
    }else{
      if(ch==='"') inQ = true;
      else if(ch===','){ result.push(cur); cur=''; }
      else cur+=ch;
    }
  }
  result.push(cur);
  return result;
}

// ============================================================
//  JSON导入导出
// ============================================================

function exportAllData(){
  const json = JSON.stringify(DATA, null, 2);
  downloadFile(json, '导师决策数据_'+new Date().toISOString().slice(0,10)+'.json', 'application/json');
}

function importAllData(e){
  const file = e.target.files[0];
  if(!file) return;
  if(!confirm('导入将覆盖当前全部数据，确定继续？')) { e.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = function(ev){
    try{
      const data = JSON.parse(ev.target.result);
      if(!data.tutors || !data.metrics) throw new Error('数据格式不正确');
      DATA = data;
      if(!DATA.meta) DATA.meta = {version:'1.0',lastUpdate:''};
      if(!DATA.examInfo) DATA.examInfo = {years:[],records:[]};
      if(!DATA.interview) DATA.interview = {schedule:[],content:[],flow:[],tips:[]};
      saveData();
      alert('导入成功！');
      renderAll();
      renderAdminTab(currentAdminTab);
    }catch(err){
      alert('导入失败：'+err.message);
    }
    e.target.value = '';
  };
  reader.readAsText(file);
}

function resetAllData(){
  if(!confirm('确定重置为示例数据？所有自定义数据将丢失！')) return;
  if(!confirm('再次确认：真的要清空所有数据吗？')) return;
  DATA = JSON.parse(JSON.stringify(SAMPLE_DATA));
  saveData();
  alert('已重置为示例数据');
  renderAll();
  renderAdminTab(currentAdminTab);
}

function downloadFile(content, filename, type){
  const blob = new Blob([content], {type: type+'charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

$('btnExportData').onclick = exportAllData;
