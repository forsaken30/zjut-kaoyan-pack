<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>浙工大材料学院考研决策包 - 登录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh}
#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center}
.login-card{background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,0.3);padding:40px;width:100%;max-width:400px}
.login-title{font-size:22px;font-weight:700;color:#1e293b;text-align:center;margin-bottom:8px}
.login-sub{font-size:14px;color:#64748b;text-align:center;margin-bottom:28px}
.form-group{margin-bottom:18px}
.form-label{display:block;font-size:13px;color:#475569;margin-bottom:6px;font-weight:500}
.form-input{width:100%;padding:12px 14px;border:1px solid #e2e8f0;border-radius:10px;font-size:15px;outline:none;transition:border-color 0.2s}
.form-input:focus{border-color:#667eea}
.login-btn{width:100%;padding:13px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;transition:opacity 0.2s}
.login-btn:hover{opacity:0.9}
.tabs{display:flex;margin-bottom:24px;border-bottom:2px solid #f1f5f9}
.tab{flex:1;text-align:center;padding:10px;font-size:14px;color:#94a3b8;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab.active{color:#667eea;border-bottom-color:#667eea;font-weight:600}
.footer-tip{text-align:center;font-size:12px;color:#94a3b8;margin-top:20px}
</style>
</head>
<body>
<div id="loginPage" style="display:none">
<div class="login-card">
<div class="login-title">📚 浙工大材料学院考研决策包</div>
<div class="login-sub">请登录以访问完整内容</div>
<div class="tabs">
<div class="tab active" onclick="switchTab('sub')" id="tabSub">订阅登录</div>
<div class="tab" onclick="switchTab('daily')" id="tabDaily">访客登录</div>
</div>
<form onsubmit="doLogin(event)">
<div class="form-group" id="userGroup">
<label class="form-label">账号</label>
<input class="form-input" id="username" type="text" placeholder="请输入账号" autocomplete="username">
</div>
<div class="form-group">
<label class="form-label">密码</label>
<input class="form-input" id="password" type="password" placeholder="请输入密码" autocomplete="current-password">
</div>
<button type="submit" class="login-btn">登 录</button>
</form>
<div class="footer-tip">© 2026 浙工大材料学院考研决策包</div>
</div>
</div>

<script>
// SCF 后端认证 - 覆盖原登录逻辑
var SCF_API_URL = "https://1471815268-kfxq13ymgt.ap-guangzhou.tencentscf.com";

async function doLogin(event) {
    event.preventDefault();
    var btn = document.querySelector('.login-btn');
    btn.disabled = true;
    btn.textContent = '登录中...';
    
    var username = document.getElementById('username').value || '';
    var password = document.getElementById('password').value;
    var loginType = currentTab; // 'sub' 或 'daily'
    
    try {
        var response = await fetch(SCF_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: username,
                password: password,
                type: loginType
            })
        });
        
        var data = await response.json();
        
        if (data.ok && data.token) {
            // 直接使用后端返回的主密钥解密内容
            var contentKeyBytes = b64ToBytes(data.token);
            var contentKeyB64 = data.token;

            // 创建会话并显示内容
            var sessionData = {
                username: data.username,
                role: data.role,
                type: data.type
            };
            createSession(sessionData, contentKeyB64);
            await showContent(contentKeyBytes);
        } else if (data.ok) {
            // 后端认证成功但未返回密钥，回退到本地ACCOUNTS查找加密密钥
            var localAccount = null;
            var uname = (username || '').trim().toLowerCase();
            for (var i = 0; i < ACCOUNTS.length; i++) {
                if (ACCOUNTS[i].u.toLowerCase() === uname) {
                    localAccount = ACCOUNTS[i];
                    break;
                }
            }
            if (localAccount && localAccount.k) {
                var key = await deriveKey(password, localAccount.s);
                var contentKeyBytes = await decryptBlob(key, localAccount.k);
                var contentKeyB64 = bytesToB64(new Uint8Array(contentKeyBytes));
                var sessionData = {
                    username: data.username,
                    role: data.role,
                    type: data.type
                };
                createSession(sessionData, contentKeyB64);
                await showContent(contentKeyBytes);
            } else if (data.encryptedKey) {
                var key2 = await deriveKey(password, data.salt);
                var contentKeyBytes2 = await decryptBlob(key2, data.encryptedKey);
                var contentKeyB64_2 = bytesToB64(new Uint8Array(contentKeyBytes2));
                var sessionData2 = {
                    username: data.username,
                    role: data.role,
                    type: data.type
                };
                createSession(sessionData2, contentKeyB64_2);
                await showContent(contentKeyBytes2);
            } else {
                showError('认证异常：未返回解密密钥');
                btn.disabled = false;
                btn.textContent = '登 录';
            }
        } else {
            showError(data.error || '登录失败');
            btn.disabled = false;
            btn.textContent = '登 录';
        }
    } catch(e) {
        showError('网络错误，请稍后重试');
        btn.disabled = false;
        btn.textContent = '登 录';
    }
}
