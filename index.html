<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="浙江工业大学材料科学与工程学院考研决策辅助工具 - 导师名额、评价、复试攻略、智能推荐">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563eb'/><text x='50' y='68' font-size='55' font-family='Arial' fill='white' text-anchor='middle' font-weight='bold'>材</text></svg>">
<title>浙工大材料学院考研决策包</title>
<style>
:root{--pri:#2563eb;--pd:#1d4ed8;--dg:#dc2626;--sc:#16a34a;--wn:#ea580c;--bg:#f1f5f9;--card:#fff;--bd:#cbd5e1;--tx:#1e293b;--tl:#64748b;--mt:#94a3b8;--g1:#f59e0b;--g2:#94a3b8;--g3:#b45309;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"Microsoft YaHei","PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--tx);line-height:1.5;font-size:14px;-webkit-font-smoothing:antialiased}
.toolbar{position:sticky;top:0;z-index:100;background:var(--pri);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.toolbar h1{font-size:16px;font-weight:600;margin-right:auto;white-space:nowrap}
.toolbar button{background:rgba(255,255,255,.2);color:#fff;border:none;padding:7px 12px;border-radius:6px;font-size:13px;cursor:pointer;white-space:nowrap}
.toolbar button:active{background:rgba(255,255,255,.35)}
.tabs{display:flex;background:var(--card);border-bottom:2px solid var(--bd);position:sticky;top:52px;z-index:90;overflow-x:auto}
.tab-btn{flex:1;min-width:70px;padding:12px 6px;background:none;border:none;font-size:13px;color:var(--tl);cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;white-space:nowrap}
.tab-btn.active{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
.content{padding:12px;max-width:1000px;margin:0 auto}
.panel{display:none}.panel.active{display:block}
.card{background:var(--card);border-radius:8px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card-title{font-size:15px;font-weight:600;margin-bottom:8px;color:var(--tx)}
.section-title{font-size:16px;font-weight:700;margin:16px 0 8px;color:var(--pri);padding-bottom:4px;border-bottom:2px solid var(--pri)}
.sub-title{font-size:14px;font-weight:600;color:var(--tl);margin:12px 0 6px}
table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
th{background:#e0e7ff;padding:8px 6px;text-align:center;border:1px solid var(--bd);font-weight:600;white-space:nowrap}
td{padding:6px;border:1px solid var(--bd);text-align:center}
tr:nth-child(even){background:#f8fafc}
tr:hover{background:#eff6ff}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:160px;padding:8px 0;border-bottom:2px solid var(--bd);margin:8px 0}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:30px}
.bar-fill{width:80%;background:var(--pri);border-radius:4px 4px 0 0;min-height:2px;transition:height .3s;position:relative}
.bar-fill.alt{background:var(--sc)}.bar-fill.warn{background:var(--wn)}
.bar-label{font-size:10px;color:var(--tl);margin-top:4px;white-space:nowrap;text-align:center}
.bar-val{font-size:11px;font-weight:600;color:var(--tx);margin-bottom:2px}
.stat-box{display:inline-block;padding:8px 12px;margin:4px;border-radius:6px;background:#e0e7ff;text-align:center}
.stat-val{font-size:20px;font-weight:700;color:var(--pri)}
.stat-label{font-size:11px;color:var(--tl)}
.tutor-card{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--card);border-radius:6px;margin-bottom:4px;box-shadow:0 1px 2px rgba(0,0,0,.05);flex-wrap:wrap}
.tutor-card:hover{background:#eff6ff}
.tutor-name{font-size:14px;font-weight:600;min-width:60px}
.tutor-inst{font-size:11px;color:var(--tl);background:#e0e7ff;padding:2px 6px;border-radius:4px}
.badge{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600}
.badge.xs{background:#dbeafe;color:#1d4ed8}.badge.zhuan{background:#dcfce7;color:#16a34a}
.badge.total{background:#fef3c7;color:#b45309}
.badge.grade-s{background:#fef3c7;color:#b45309;font-weight:700;font-size:13px}
.badge.grade-a{background:#dcfce7;color:#16a34a;font-weight:700;font-size:13px}
.badge.grade-b{background:#dbeafe;color:#1d4ed8;font-size:12px}
.badge.grade-c{background:#fee2e2;color:#dc2626;font-size:12px}
.tutor-reason{width:100%;font-size:11px;color:#64748b;margin-top:4px;padding-left:4px;border-left:2px solid #e2e8f0}
.tutor-role{font-size:11px;color:#64748b}
.search-box{width:100%;padding:10px;border:1px solid var(--bd);border-radius:6px;font-size:14px;margin-bottom:8px}
.filter-row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.filter-btn{padding:6px 12px;border:1px solid var(--bd);border-radius:6px;font-size:12px;cursor:pointer;background:#fff;color:var(--tx)}
.filter-btn.active{background:var(--pri);color:#fff;border-color:var(--pri)}
.field-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #e2e8f0}
.field-row:last-child{border-bottom:none}
.field-name{flex:1;font-size:13px}
.weight-input,.score-input{width:56px;padding:5px 4px;text-align:center;border:1px solid var(--bd);border-radius:4px;font-size:13px}
.weight-input:disabled,.score-input:disabled{background:#f1f5f9;color:var(--mt)}
.switch{position:relative;width:36px;height:20px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:#cbd5e1;border-radius:20px;transition:.3s}
.slider:before{content:"";position:absolute;height:14px;width:14px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
.switch input:checked+.slider{background:var(--sc)}
.switch input:checked+.slider:before{transform:translateX(16px)}
.btn{padding:8px 14px;border:none;border-radius:6px;font-size:13px;cursor:pointer;text-align:center}
.btn-pri{background:var(--pri);color:#fff}.btn-sc{background:var(--sc);color:#fff}
.btn-wn{background:var(--wn);color:#fff}.btn-dg{background:var(--dg);color:#fff}
.btn-ol{background:#fff;color:var(--pri);border:1px solid var(--pri)}
.btn:active{opacity:.8}
.btn-row{display:flex;gap:6px;flex-wrap:wrap}
.total-w{font-size:13px;font-weight:600;padding:6px 10px;border-radius:6px;margin-top:6px}
.total-w.ok{background:#dcfce7;color:var(--sc)}
.total-w.warn{background:#fef3c7;color:var(--wn)}
.tutor-item{display:flex;align-items:center;gap:8px;padding:8px;background:var(--card);border-radius:6px;margin-bottom:4px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.tutor-item:active{transform:scale(.98)}
.tutor-item.sel{border:2px solid var(--pri)}
.tutor-rank{width:28px;height:28px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.tutor-rank.t1{background:#f59e0b}.tutor-rank.t2{background:#94a3b8}.tutor-rank.t3{background:#b45309}
.tutor-nm{flex:1;font-size:14px;font-weight:500}
.tutor-sc{font-size:15px;font-weight:700;color:var(--pri)}
.tutor-sc.none{color:var(--mt)}
.empty{text-align:center;padding:30px 20px;color:var(--tl)}
.data-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.data-lb{width:90px;font-size:12px;color:var(--tl);flex-shrink:0}
.data-ip{flex:1;padding:5px 6px;border:1px solid var(--bd);border-radius:4px;font-size:13px}
.statusbar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:6px 12px;font-size:11px;color:var(--tl);text-align:center}

/* ===== 管理后台 ===== */
.admin-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:500;align-items:center;justify-content:center;padding:20px}
.admin-overlay.show{display:flex}
.admin-panel{width:100%;max-width:1100px;height:90vh;background:#fff;border-radius:12px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.admin-header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--bd)}
.admin-header h2{font-size:18px;color:#1e40af}
.admin-close{background:#fee2e2;color:#dc2626;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600}
.admin-close:hover{background:#fecaca}
.admin-body{flex:1;display:flex;overflow:hidden}
.admin-sidebar{width:180px;border-right:1px solid var(--bd);padding:12px;overflow-y:auto;background:#f8fafc}
.admin-menu-item{padding:10px 12px;border-radius:6px;cursor:pointer;font-size:13px;margin-bottom:4px;transition:all .15s}
.admin-menu-item:hover{background:#e2e8f0}
.admin-menu-item.active{background:#2563eb;color:#fff;font-weight:600}
.admin-content{flex:1;padding:20px;overflow-y:auto}
.admin-content h3{font-size:16px;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid var(--bd)}
.admin-toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.admin-toolbar input[type="text"]{padding:8px 10px;border:1px solid var(--bd);border-radius:6px;font-size:13px;flex:1;min-width:200px}
.admin-table{width:100%;border-collapse:collapse;font-size:13px}
.admin-table th{background:#f8fafc;padding:10px;text-align:left;font-weight:600;border-bottom:2px solid var(--bd);color:var(--tl)}
.admin-table td{padding:10px;border-bottom:1px solid #f1f5f9}
.admin-table tr:hover{background:#f8fafc}
.admin-table .at-actions{display:flex;gap:4px}
.at-btn{padding:4px 10px;border:none;border-radius:4px;cursor:pointer;font-size:12px}
.at-btn-edit{background:#dbeafe;color:#1d4ed8}
.at-btn-del{background:#fee2e2;color:#dc2626}
.at-btn-move{background:#e2e8f0;color:#475569}
.empty-tip{text-align:center;color:#94a3b8;padding:30px}
.admin-modal-mask{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:600;align-items:center;justify-content:center}
.admin-modal-mask.show{display:flex}
.admin-modal{background:#fff;border-radius:10px;padding:24px;max-width:560px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.admin-modal h4{font-size:16px;margin-bottom:16px}
.gen-modal-mask{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:700;align-items:center;justify-content:center}
.gen-modal-mask.show{display:flex}
.gen-modal{background:#fff;border-radius:10px;padding:20px;max-width:800px;width:92%;max-height:85vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.2);position:relative}
.gen-modal-title{font-size:16px;font-weight:700;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.gen-modal-close{cursor:pointer;font-size:22px;color:#94a3b8;border:none;background:none;line-height:1;padding:0 4px}
.gen-modal-close:hover{color:#ef4444}
.am-form-group{margin-bottom:14px}
.am-form-group label{display:block;font-size:13px;font-weight:500;margin-bottom:4px;color:#334155}
.am-form-group input,.am-form-group select,.am-form-group textarea{width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:13px;font-family:inherit}
.am-form-group textarea{min-height:80px;resize:vertical}
.am-form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.am-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--bd)}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;transition:all .2s}
.btn-pri{background:#2563eb;color:#fff}.btn-pri:hover{background:#1d4ed8}
.btn-sec{background:#e2e8f0;color:#475569}.btn-sec:hover{background:#cbd5e1}
.btn-dan{background:#ef4444;color:#fff}.btn-dan:hover{background:#dc2626}
.btn-suc{background:#10b981;color:#fff}.btn-suc:hover{background:#059669}
.btn-sm{padding:5px 10px;font-size:12px}
.module-card{border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:8px;background:#f8fafc}
.module-card .mc-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.module-card .mc-type{font-size:11px;background:#2563eb;color:#fff;padding:2px 8px;border-radius:10px}
.module-card .mc-title{font-weight:600;font-size:14px;flex:1}
.module-card .mc-actions{display:flex;gap:4px}
@media(max-width:768px){
  .admin-body{flex-direction:column}
  .admin-sidebar{width:100%;display:flex;flex-wrap:wrap;gap:4px;border-right:none;border-bottom:1px solid var(--bd)}
  .admin-menu-item{margin-bottom:0;flex:1;min-width:80px;text-align:center;font-size:12px;padding:8px}
  .am-form-row{grid-template-columns:1fr}
  .admin-panel{height:95vh}
  /* 移动端表格横向滚动 */
  .admin-table-wrap, .data-table-wrap, .card-content{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{min-width:600px;font-size:12px}
  .admin-table{min-width:700px}
}
#csvFile{display:none}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;z-index:200;max-width:90%;text-align:center}
.tip-list li{margin:4px 0;padding-left:8px;font-size:13px;line-height:1.6}
.match-row{display:flex;gap:4px;align-items:center;padding:4px;background:var(--card);border-radius:4px;margin-bottom:4px}
.match-row input{padding:4px 6px;border:1px solid var(--bd);border-radius:4px;font-size:12px}
.match-row .mn{flex:1}.match-row .ms{width:80px}
.match-del{width:28px;height:28px;border:none;border-radius:4px;background:var(--dg);color:#fff;cursor:pointer;font-size:14px}
.timeline{position:relative;padding-left:20px}
.timeline:before{content:"";position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--bd)}
.timeline-item{position:relative;padding:8px 0 8px 16px}
.timeline-item:before{content:"";position:absolute;left:-20px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--pri);border:2px solid #fff}
.timeline-time{font-size:11px;color:var(--tl);font-weight:600}
.timeline-step{font-size:14px;font-weight:600;color:var(--tx)}
.timeline-desc{font-size:12px;color:var(--tl);margin-top:2px}
.result-box{padding:16px;border-radius:8px;margin:8px 0;text-align:center}
.result-good{background:#dcfce7;border:1px solid #16a34a}
.result-warn{background:#fef3c7;border:1px solid #ea580c}
.result-bad{background:#fee2e2;border:1px solid #dc2626}
.result-title{font-size:16px;font-weight:700;margin-bottom:8px}
.result-detail{font-size:13px;color:var(--tx)}
.note-box{background:#fffbeb;border-left:4px solid #f59e0b;padding:8px 12px;border-radius:4px;margin:8px 0;font-size:13px}
@media(min-width:768px){.desk-split{display:flex;gap:12px}.desk-split>*{flex:1}}
/* 密码保护层 */
#lockScreen{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#1e3a5f,#2563eb);display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:20px}
#lockScreen .lock-card{background:#fff;border-radius:16px;padding:32px 24px;max-width:380px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#lockScreen .lock-icon{width:60px;height:60px;margin:0 auto 12px;border-radius:50%;background:linear-gradient(135deg,#eff6ff,#dbeafe);display:flex;align-items:center;justify-content:center;font-size:30px}
#lockScreen .lock-title{font-size:19px;font-weight:700;color:#1e293b;margin-bottom:4px}
#lockScreen .lock-sub{font-size:13px;color:#64748b;margin-bottom:16px}
#lockScreen .lock-input{width:100%;padding:11px 14px;border:2px solid #cbd5e1;border-radius:8px;font-size:15px;text-align:left;margin-bottom:8px;outline:none;transition:border-color .2s}
#lockScreen .lock-input:focus{border-color:#2563eb}
#lockScreen .lock-btn{width:100%;padding:12px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:8px;transition:opacity .2s}
#lockScreen .lock-btn-guest{background:#f1f5f9;color:#475569;border:2px solid #cbd5e1}
#lockScreen .lock-btn-guest:hover{background:#e2e8f0}
#lockScreen .lock-btn-sub{background:#2563eb;color:#fff}
#lockScreen .lock-btn-sub:active{background:#1d4ed8}
#lockScreen .lock-btn-master{background:#f59e0b;color:#fff}
#lockScreen .lock-btn-master:active{background:#d97706}
#lockScreen .lock-hint{font-size:11px;color:#94a3b8;margin-top:6px;line-height:1.6}
#lockScreen .lock-error{color:#dc2626;font-size:13px;margin-bottom:8px;min-height:18px}
#lockScreen .lock-shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#lockScreen .login-divider{position:relative;margin:14px 0;text-align:center}
#lockScreen .login-divider::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:#e2e8f0}
#lockScreen .login-divider span{position:relative;background:#fff;padding:0 12px;font-size:12px;color:#94a3b8}
#lockScreen .master-toggle{font-size:12px;color:#f59e0b;cursor:pointer;text-decoration:underline;margin-bottom:8px}
#lockScreen .master-toggle:hover{color:#d97706}
/* 动态密码面板（仅主人可见） */
#lockScreen .daily-panel{margin-top:14px;padding:12px;border-radius:8px;background:#f0fdf4;border:2px solid #16a34a;text-align:center}
#lockScreen .daily-panel-title{font-size:12px;color:#16a34a;font-weight:600;margin-bottom:6px}
#lockScreen .daily-code{font-size:24px;font-weight:700;color:#16a34a;letter-spacing:3px;font-family:monospace}
#lockScreen .daily-date{font-size:11px;color:#94a3b8;margin-top:4px}
#lockScreen .daily-copy{margin-top:8px;padding:6px 16px;background:#16a34a;color:#fff;border:none;border-radius:6px;font-size:12px;cursor:pointer}
/* 订阅登录面板 */
#lockScreen .sub-label{font-size:12px;color:#64748b;font-weight:600;margin-bottom:6px;text-align:left}
/* 游客限权提示 */
#lockScreen .guest-notice{font-size:11px;color:#92400e;background:#fffbeb;border-radius:6px;padding:8px;margin-top:4px;line-height:1.6}

/* 智能推荐引擎样式 */
.rec-card{border:1px solid #e2e8f0;border-radius:10px;padding:14px;margin-bottom:10px;transition:box-shadow .2s}
.rec-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.08)}
.rec-tier{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700}
.tier-green{background:#dcfce7;color:#16a34a}
.tier-yellow{background:#fef9c3;color:#a16207}
.tier-orange{background:#ffedd5;color:#c2410c}
.tier-red{background:#fee2e2;color:#dc2626}
.rec-stats{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#64748b;margin:8px 0}
.rec-stat{background:#f8fafc;padding:4px 10px;border-radius:6px}
.rec-actions{display:flex;gap:6px;margin-top:8px}
.rec-btn{padding:4px 12px;border:1px solid #cbd5e1;border-radius:6px;font-size:12px;cursor:pointer;background:#fff;transition:all .2s}
.rec-btn:hover{background:#f1f5f9}
.rec-btn.active{background:#2563eb;color:#fff;border-color:#2563eb}
.rec-fav.active{background:#fef3c7;color:#f59e0b;border-color:#fbbf24}
.rec-form{background:#f8fafc;border-radius:10px;padding:16px;margin-bottom:16px}
.rec-form-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.rec-form label{font-size:13px;font-weight:600;color:#475569;min-width:80px}
.rec-form select,.rec-form input[type=number]{padding:8px 12px;border:1px solid #cbd5e1;border-radius:6px;font-size:14px;outline:none}
.rec-form select:focus,.rec-form input:focus{border-color:#2563eb}
/* 对比表样式 */
.cmp-table{width:100%;border-collapse:collapse;font-size:13px}

<script>
// ===== 三层权限系统（游客/订阅/主人）=====
// 原理：
//   1. 主人密码（固定）：只有你知道，输入后进入主人模式，可管理全部数据和订阅账号
//   2. 订阅账号（账号+密码）：主人创建的订阅用户，登录后享完整只读访问权限
//   3. 游客模式：无需密码，点击进入，仅可预览部分功能
//   4. 动态密码（每天变化）：主人登录后可查看，用于替代旧版访客密码（兼容旧流程）
//
// 【修改主人密码】：用 computeMasterHash('你的新密码') 在控制台生成哈希，替换 MASTER_PASS_HASH 的值
// 主人密码采用 SHA-256 + 1000轮迭代 + 盐值，无明文存储
var MASTER_PASS_HASH = 's2_656f446da9fa1e8839c1fd525c96c1486ead406f3ebba96f82942aa703b70256';
var SECRET_SEED = 'ZJUT_MaterialSci_2026_DecisionPack_Secret_v2';
var LOCK_SESSION_KEY = 'decision_unlocked';
var LOCK_DATE_KEY = 'decision_unlock_date';
var LOCK_ROLE_KEY = 'decision_role'; // 'master' / 'subscriber' / 'guest'
var SCF_API_URL = 'https://1471815268-kfxq13ymgt.ap-guangzhou.tencentscf.com';
var ACCOUNTS_KEY = 'decision_accounts'; // 订阅账号存储键
var LOGIN_FAIL_KEY = 'decision_login_fail'; // 登录失败计数
var MAX_LOGIN_FAIL = 5; // 最大失败次数
var LOCK_DURATION_MS = 60000; // 锁定时长（1分钟）
var AUDIT_LOG_KEY = 'decision_audit_log'; // 操作审计日志
var MAX_AUDIT_LOGS = 200; // 最多保留200条日志

// ===== SHA-256 实现（同步版，用于密码哈希）=====
function sha256(str){
  // 将字符串转为 UTF-8 字节数组
  function strToUtf8Bytes(s){
    var bytes = [];
    for(var i=0;i<s.length;i++){
      var c = s.charCodeAt(i);
      if(c < 0x80){
        bytes.push(c);
      } else if(c < 0x800){
        bytes.push(0xC0 | (c>>6));
        bytes.push(0x80 | (c & 0x3F));
      } else if(c < 0xD800 || c >= 0xE000){
        bytes.push(0xE0 | (c>>12));
        bytes.push(0x80 | ((c>>6) & 0x3F));
        bytes.push(0x80 | (c & 0x3F));
      } else {
        // 代理对（UTF-16 surrogate pairs）
        i++;
        var c2 = s.charCodeAt(i);
        var cp = 0x10000 + (((c & 0x3FF)<<10) | (c2 & 0x3FF));
        bytes.push(0xF0 | (cp>>18));
        bytes.push(0x80 | ((cp>>12) & 0x3F));
        bytes.push(0x80 | ((cp>>6) & 0x3F));
        bytes.push(0x80 | (cp & 0x3F));
      }
    }
    return bytes;
  }
  function rotr(n,x){ return (x>>>n) | (x<<(32-n)); }
  function ch(x,y,z){ return (x & y) ^ (~x & z); }
  function maj(x,y,z){ return (x & y) ^ (x & z) ^ (y & z); }
  function sig0(x){ return rotr(2,x) ^ rotr(13,x) ^ rotr(22,x); }
  function sig1(x){ return rotr(6,x) ^ rotr(11,x) ^ rotr(25,x); }
  function gam0(x){ return rotr(7,x) ^ rotr(18,x) ^ (x>>>3); }
  function gam1(x){ return rotr(17,x) ^ rotr(19,x) ^ (x>>>10); }

  var msg = strToUtf8Bytes(str);
  var ml = msg.length * 8;

  // 填充
  msg.push(0x80);
  while(msg.length % 64 !== 56) msg.push(0);
  // 追加原始长度（64位大端，高32位补零）
  msg.push(0,0,0,0); // 高32位（实际输入不会超过4GB，恒为0）
  msg.push((ml>>>24)&0xFF, (ml>>>16)&0xFF, (ml>>>8)&0xFF, ml&0xFF); // 低32位

  var K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ];

  var h0=0x6a09e667, h1=0xbb67ae85, h2=0x3c6ef372, h3=0xa54ff53a;
  var h4=0x510e527f, h5=0x9b05688c, h6=0x1f83d9ab, h7=0x5be0cd19;

  for(var offset=0; offset<msg.length; offset+=64){
    var w = new Array(64);
    for(var t=0;t<16;t++){
      w[t] = (msg[offset+t*4]<<24) | (msg[offset+t*4+1]<<16) | (msg[offset+t*4+2]<<8) | msg[offset+t*4+3];
    }
    for(var t=16;t<64;t++){
      w[t] = (gam1(w[t-2]) + w[t-7] + gam0(w[t-15]) + w[t-16]) | 0;
    }
    var a=h0, b=h1, c=h2, d=h3, e=h4, f=h5, g=h6, h=h7;
    for(var t=0;t<64;t++){
      var T1 = (h + sig1(e) + ch(e,f,g) + K[t] + w[t]) | 0;
      var T2 = (sig0(a) + maj(a,b,c)) | 0;
      h = g; g = f; f = e; e = (d + T1) | 0;
      d = c; c = b; b = a; a = (T1 + T2) | 0;
    }
    h0=(h0+a)|0; h1=(h1+b)|0; h2=(h2+c)|0; h3=(h3+d)|0;
    h4=(h4+e)|0; h5=(h5+f)|0; h6=(h6+g)|0; h7=(h7+h)|0;
  }

  function toHex(n){
    n = n >>> 0;
    var s = n.toString(16);
    while(s.length < 8) s = '0' + s;
    return s;
  }
  return toHex(h0)+toHex(h1)+toHex(h2)+toHex(h3)+toHex(h4)+toHex(h5)+toHex(h6)+toHex(h7);
}

// CRC32 实现（保留用于旧密码兼容迁移）
var CRC32_TABLE = (function(){
  var t = new Array(256);
  for(var i=0;i<256;i++){
    var c=i;
    for(var j=0;j<8;j++){
      if(c&1) c=0xEDB88320^(c>>>1); else c=c>>>1;
    }
    t[i]=c>>>0;
  }
  return t;
})();
function crc32(str){
  var crc=0xFFFFFFFF;
  for(var i=0;i<str.length;i++){
    var code=str.charCodeAt(i);
    if(code>255){
      var bytes=unescape(encodeURIComponent(str.charAt(i)));
      for(var k=0;k<bytes.length;k++){
        crc=(crc>>>8)^CRC32_TABLE[(crc^bytes.charCodeAt(k))&0xFF];
      }
    } else {
      crc=(crc>>>8)^CRC32_TABLE[(crc^code)&0xFF];
    }
  }
  return (crc^0xFFFFFFFF)>>>0;
}

// 获取今日日期字符串
function getTodayStr(){
  var d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}

// 生成今日动态密码（SHA-256 + 8位字母数字混合，安全性大幅提升）
function getDailyPassword(){
  var raw = SECRET_SEED + '|daily|' + getTodayStr();
  var hash = sha256(raw);
  // 取前8位，全小写字母+数字，共 36^8 ≈ 2.8万亿 种组合
  var code = hash.substring(0, 8);
  return code;
}

// ===== 订阅账号管理 =====
// 密码哈希（SHA-256 + 盐值 + 多轮迭代，安全性高）
// hashAlgo: 'sha256'=新算法 'crc32'=旧算法（兼容用）
function hashPassword(pwd, salt, algo){
  if(algo === 'crc32'){
    return crc32(salt + '|' + pwd + '|' + SECRET_SEED).toString(36);
  }
  // SHA-256 + 1000轮迭代 + 盐值（PBKDF2简化版）
  var hash = sha256(salt + ':' + pwd + ':' + SECRET_SEED);
  for(var i=0;i<1000;i++){
    hash = sha256(hash + ':' + salt + ':' + i);
  }
  return 's2_' + hash; // 前缀标识算法版本
}
// 生成随机盐值
function genSalt(){
  return Math.random().toString(36).substring(2,10);
}
// ===== 登录防暴力破解 =====
function getLoginFailInfo(){
  try{
    var s = localStorage.getItem(LOGIN_FAIL_KEY);
    if(!s) return {count:0, lockedUntil:0};
    var obj = JSON.parse(s);
    // 锁定已过期，重置
    if(obj.lockedUntil && Date.now() > obj.lockedUntil){
      return {count:0, lockedUntil:0};
    }
    return obj;
  } catch(e){ return {count:0, lockedUntil:0}; }
}
function isLoginLocked(){
  var info = getLoginFailInfo();
  return info.lockedUntil && Date.now() < info.lockedUntil;
}
function getLockRemainingSec(){
  var info = getLoginFailInfo();
  if(!info.lockedUntil) return 0;
  var ms = info.lockedUntil - Date.now();
  return Math.max(0, Math.ceil(ms / 1000));
}
function recordLoginFail(success){
  var info = getLoginFailInfo();
  if(success){
    info = {count:0, lockedUntil:0};
  } else {
    info.count = (info.count || 0) + 1;
    if(info.count >= MAX_LOGIN_FAIL){
      info.lockedUntil = Date.now() + LOCK_DURATION_MS;
    }
  }
  try{ localStorage.setItem(LOGIN_FAIL_KEY, JSON.stringify(info)); } catch(e){}
}
// 工具：在浏览器控制台调用 computeMasterHash('新密码') 生成主人密码哈希
function computeMasterHash(newPwd){
  return hashPassword(newPwd, 'master', 'sha256');
}
// ===== 操作审计日志 =====
function addAuditLog(action, detail){
  try{
    var logs = [];
    var raw = localStorage.getItem(AUDIT_LOG_KEY);
    if(raw){ try{ logs = JSON.parse(raw); } catch(e){ logs = []; } }
    var role = isMaster() ? 'master' : (isSubscriber() ? 'subscriber' : 'guest');
    var user = sessionStorage.getItem('decision_sub_user') || (role === 'master' ? '主人' : '访客');
    logs.unshift({
      time: new Date().toISOString(),
      action: action,
      detail: detail || '',
      role: role,
      user: user,
      ip: '-' // 纯前端无法获取真实IP
    });
    if(logs.length > MAX_AUDIT_LOGS) logs = logs.slice(0, MAX_AUDIT_LOGS);
    localStorage.setItem(AUDIT_LOG_KEY, JSON.stringify(logs));
  } catch(e){}
}
function getAuditLogs(){
  try{
    var raw = localStorage.getItem(AUDIT_LOG_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e){ return []; }
}
// 读取账号列表
function getAccounts(){
  try {
    var raw = localStorage.getItem(ACCOUNTS_KEY);
    if(!raw) return [];
    return JSON.parse(raw);
  } catch(e){ return []; }
}
// 保存账号列表
function saveAccounts(list){
  localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(list));
}
// 查找账号
function findAccount(username){
  var list = getAccounts();
  username = (username||'').trim().toLowerCase();
  for(var i=0;i<list.length;i++){
    if(list[i].username.toLowerCase() === username) return list[i];
  }
  return null;
}
// 验证账号密码（支持 SHA-256 和 CRC32 双算法，旧密码自动升级）
function verifyAccount(username, pwd){
  var acc = findAccount(username);
  if(!acc) return null;
  if(acc.status !== 'active') return null;
  // 试用账号：按激活时间计算过期
  if(acc.type === 'trial'){
    if(acc.activatedAt){
      var trialExp = new Date(acc.activatedAt).getTime() + acc.trialHours * 3600000;
      if(Date.now() > trialExp) return null;
    }
  } else {
    // 普通账号：按固定日期判断
    if(acc.expiry){
      var exp = new Date(acc.expiry);
      var now = new Date();
      if(now > exp) return null;
    }
  }

  // 判断哈希算法：以 s2_ 开头为 SHA-256，否则为旧 CRC32
  var isNewHash = acc.passHash && acc.passHash.substring(0,3) === 's2_';
  var hash;
  if(isNewHash){
    hash = hashPassword(pwd, acc.salt, 'sha256');
  } else {
    hash = hashPassword(pwd, acc.salt, 'crc32');
  }

  if(hash === acc.passHash){
    // 旧密码自动升级为 SHA-256
    if(!isNewHash){
      var newHash = hashPassword(pwd, acc.salt, 'sha256');
      var list = getAccounts();
      for(var i=0;i<list.length;i++){
        if(list[i].username.toLowerCase() === acc.username.toLowerCase()){
          list[i].passHash = newHash;
          saveAccounts(list);
          break;
        }
      }
      acc.passHash = newHash;
    }
    // 试用账号首次登录，记录激活时间
    if(acc.type === 'trial' && !acc.activatedAt){
      acc.activatedAt = new Date().toISOString();
      var list2 = getAccounts();
      for(var j=0;j<list2.length;j++){
        if(list2[j].username.toLowerCase() === acc.username.toLowerCase()){
          list2[j].activatedAt = acc.activatedAt;
          saveAccounts(list2);
          break;
        }
      }
    }
    return acc;
  }
  return null;
}
// 创建新账号（仅主人可调用）
function createAccount(username, pwd, expiryDays){
  if(!isMaster()) return {ok:false, msg:'无权限：仅主人可创建账号'};
  username = (username||'').trim();
  if(!username || !pwd) return {ok:false, msg:'账号和密码不能为空'};
  if(username.length < 2) return {ok:false, msg:'账号至少2个字符'};
  if(pwd.length < 6) return {ok:false, msg:'密码至少6个字符'};
  if(findAccount(username)) return {ok:false, msg:'该账号已存在'};
  var salt = genSalt();
  var acc = {
    username: username,
    salt: salt,
    passHash: hashPassword(pwd, salt),

function checkMaster(){

// 订阅用户登录验证
function checkSubscriber(){
  if(isLoginLocked()){
    var sec = getLockRemainingSec();
    lockError('登录失败次数过多，请 ' + sec + ' 秒后再试');
    return;
  }
  var userInp = document.getElementById('subUser');
  var passInp = document.getElementById('subPass');
  var username = userInp ? userInp.value : '';
  var pwd = passInp ? passInp.value : '';
  if(!username || !pwd){ lockError('请输入账号和密码'); return; }
  lockError('验证中...');
  fetch(SCF_API_URL,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:username,password:pwd,type:'sub'})
  }).then(function(r){return r.json();}).then(function(data){
    if(data.ok && data.token){
      recordLoginFail(true);
      addAuditLog('订阅登录', '账号: ' + username);
      sessionStorage.setItem(LOCK_SESSION_KEY,'1');
      sessionStorage.setItem(LOCK_DATE_KEY,getTodayStr());
      sessionStorage.setItem(LOCK_ROLE_KEY,'subscriber');
      sessionStorage.setItem('decision_sub_user', data.username || username);
      sessionStorage.setItem('scf_token', data.token);
      window.__SCF_TOKEN = data.token;
      // 同步试用账号激活信息到本地
      if(data.type === 'trial' || data.activatedAt !== undefined || data.trialStatus){
        var list = getAccounts();
        var loginUser = (data.username || username).toLowerCase();
        for(var j=0;j<list.length;j++){
          if(list[j].username.toLowerCase() === loginUser){
            if(data.activatedAt !== undefined) list[j].activatedAt = data.activatedAt;
            if(data.trialStatus === 'not_activated') list[j].activatedAt = null;
            if(data.trialHours !== undefined) list[j].trialHours = data.trialHours;
            break;
          }
        }
        saveAccounts(list);
      }
      unlockApp();
    } else {
      recordLoginFail(false);
      lockError(data.error || '登录失败');
    }
  }).catch(function(e){
    recordLoginFail(false);
    lockError('网络错误，请稍后重试');
  });
}

// 获取今日日期字符串
function getTodayStr(){
  var d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}

// 生成今日动态密码（SHA-256 + 8位字母数字混合）
function getDailyPassword(){
  var raw = SECRET_SEED + '|daily|' + getTodayStr();
  var hash = sha256(raw);
  var code = hash.substring(0, 8);
  return code;
}

    var sec = getLockRemainingSec();
    lockError('登录失败次数过多，请 ' + sec + ' 秒后再试');
    return;
  }
  var input = document.getElementById('lockInput');
  var err = document.getElementById('lockError');

  if(isMasterMode){
    // 主人模式：验证主人密码（SHA-256 哈希）

    if(hash === MASTER_PASS_HASH){
      sessionStorage.setItem(LOCK_SESSION_KEY, '1');
      sessionStorage.setItem(LOCK_DATE_KEY, today);
      sessionStorage.setItem(LOCK_ROLE_KEY, 'master'); // 记录为主人
      recordLoginFail(true);

      // 3秒后自动解锁
      setTimeout(function(){ unlockApp(); }, 3000);
    } else {
      recordLoginFail(false);
      lockError('主人密码错误');
    }
  } else {
    // 访客模式：验证今日动态密码
    var daily = getDailyPassword();
    if(pwd === daily){
      recordLoginFail(true);
      sessionStorage.setItem(LOCK_SESSION_KEY, '1');
      sessionStorage.setItem(LOCK_DATE_KEY, today);
      sessionStorage.setItem(LOCK_ROLE_KEY, 'visitor'); // 记录为访客

    } else {
      lockError('今日密码错误或已过期');
    }
  }
}

    } else if(sub){
      var uname = sessionStorage.getItem('decision_sub_user') || '订阅用户';
      badge.textContent = '⭐ ' + uname;
      badge.style.background = '#dbeafe';
      badge.style.color = '#1e40af';
    } else {
      badge.textContent = '👁️ 游客试用';
      badge.style.background = '#f1f5f9';
      badge.style.color = '#64748b';
    }
  }
  // 状态栏
  var roleTag = master ? '👑 主人模式' : (sub ? '⭐ 订阅用户' : '👁️ 游客试用');
  var sb = $('statusbar');
  if(sb) sb.textContent = roleTag + ' · 就绪';
  // 游客隐藏部分标签页
  var tabs = document.querySelectorAll('.tab-btn');
  for(var i=0;i<tabs.length;i++){
    var btn = tabs[i];
    var tabName = btn.getAttribute('onclick');
    var locked = false;
    for(var j=0;j<GUEST_LOCKED_TABS.length;j++){
      if(tabName && tabName.indexOf("'"+GUEST_LOCKED_TABS[j]+"'") >= 0){
        locked = true;
        break;
      }
    }
    if(guest && locked){
      btn.style.display = 'none';
    } else {
      btn.style.display = '';
    }
  }
}

function switchTab(name, btn){
  var btns = document.querySelectorAll('.tab-btn');
  for(var i=0;i<btns.length;i++) btns[i].classList.remove('active');
  var ps = document.querySelectorAll('.panel');
  for(var j=0;j<ps.length;j++) ps[j].classList.remove('active');
  if(btn) btn.classList.add('active');
  var p = $('p-'+name);
  if(p) p.classList.add('active');
}

// ===== Storage =====
function loadState(){
  try{ scoringConfig = JSON.parse(localStorage.getItem('scoringConfig')) || {}; }catch(e){ scoringConfig = {}; }
  try{ scoringData = JSON.parse(localStorage.getItem('scoringData')) || {}; }catch(e){ scoringData = {}; }
  try{ matchData = JSON.parse(localStorage.getItem('matchData')) || []; }catch(e){ matchData = []; }
  for(var i=0;i<SCORING_FIELDS.length;i++){
    var f = SCORING_FIELDS[i];
    if(!scoringConfig[f.key]) scoringConfig[f.key] = { w: f.w, en: true };
  }
}

function saveAll(){
  if(!requireMaster()) return;
  localStorage.setItem('scoringConfig', JSON.stringify(scoringConfig));
  localStorage.setItem('scoringData', JSON.stringify(scoringData));
  localStorage.setItem('matchData', JSON.stringify(matchData));
  showToast('全部数据已保存');
  setStatus('已保存 ' + new Date().toLocaleTimeString());
}

// ===== 1. Overview =====
function renderOverview(){
  var p = $('p-overview');
  if(!p) return;
  var h = '';
  // trends
  h += '<div class="card"><div class="card-title">三年核心指标对比（2024-2026）</div>';
  h += '<table><thead><tr><th>指标</th><th>2024</th><th>2025</th><th>2026</th><th>趋势分析</th></tr></thead><tbody>';
  for(var i=0;i<APP_DATA.trends.length;i++){
    var t = APP_DATA.trends[i];
    h += '<tr><td>'+esc(t.metric)+'</td><td>'+esc(t.y2024)+'</td><td>'+esc(t.y2025)+'</td><td>'+esc(t.y2026)+'</td><td>'+esc(t.trend)+'</td></tr>';
  }
  h += '</tbody></table></div>';
  // overview by year
  h += '<div class="card"><div class="card-title">各方向一志愿总览</div>';
  var years = [2024,2025,2026];
  for(var yi=0;yi<years.length;yi++){
    var y = years[yi];
    h += '<div class="sub-title">'+y+' 年</div>';
    h += '<table><thead><tr><th>类别</th><th>方向</th><th>人数</th><th>总分均</th><th>总分最低</th><th>总分最高</th><th>专业课均</th><th>专业课最低</th><th>专业课最高</th></tr></thead><tbody>';
    for(var k=0;k<APP_DATA.overview.length;k++){
      var o = APP_DATA.overview[k];
      if(o.year!==y) continue;
      h += '<tr><td>'+esc(o.category)+'</td><td>'+esc(o.direction)+'</td><td>'+o.count+'</td><td>'+o.avgScore+'</td><td>'+o.minScore+'</td><td>'+o.maxScore+'</td><td>'+o.courseAvg+'</td><td>'+o.courseMin+'</td><td>'+o.courseMax+'</td></tr>';
    }
    h += '</tbody></table>';
  }
  h += '</div>';
  // score distribution
  h += '<div class="card"><div class="card-title">总分分布柱状图（三年汇总）</div>';
  var dirs = [];
  for(var d=0;d<APP_DATA.scoreDist.length;d++){
    var sd = APP_DATA.scoreDist[d];
    var kk = sd.category + '|' + sd.direction;
    var found = false;
    for(var q=0;q<dirs.length;q++){ if(dirs[q].k===kk){ found=true; break; } }
    if(!found) dirs.push({k:kk, cat:sd.category, dir:sd.direction});
  }
  var ranges = ['240-259','260-279','280-299','300-319','320-339','340-359','360-379','380-399','400+'];
  for(var di=0;di<dirs.length;di++){
    var dd = dirs[di];
    h += '<div class="sub-title">'+esc(dd.cat)+' · '+esc(dd.dir)+'</div>';
    var entries = [];
    for(var e=0;e<APP_DATA.scoreDist.length;e++){
      var se = APP_DATA.scoreDist[e];
      if(se.category===dd.cat && se.direction===dd.dir) entries.push(se);
    }
    var rm = {};
    for(var ei=0;ei<entries.length;ei++){ rm[entries[ei].range] = (rm[entries[ei].range]||0) + entries[ei].count; }
    var mx = 1;
    for(var r0=0;r0<ranges.length;r0++){ var cv = rm[ranges[r0]]||0; if(cv>mx) mx=cv; }
    h += '<div class="bar-chart">';
    for(var r1=0;r1<ranges.length;r1++){
      var rg = ranges[r1];
      var c = rm[rg]||0;
      var ht = (c/mx*100).toFixed(1);
      h += '<div class="bar"><div class="bar-val">'+c+'</div><div class="bar-fill" style="height:'+ht+'%"></div><div class="bar-label">'+rg+'</div></div>';
    }
    h += '</div>';
  }
  h += '</div>';

// 评级优先级排序
function gradePriority(g){
  if(g==='S') return 0;
  if(g==='A') return 1;
  if(g==='B') return 2;
  if(g==='C') return 3;
  return 4; // 无评级排最后
}

function renderTutorCard(tu){
  var h = '<div class="tutor-card">';
  // 等级标签
  var gr = tu.grade || '';
  if(gr){
    var gc = gr==='S'?'grade-s':gr==='A'?'grade-a':gr==='B'?'grade-b':gr==='C'?'grade-c':'';
    h += '<span class="badge '+gc+'">'+esc(gr)+'</span>';
  }
  h += '<span class="tutor-name">'+esc(tu.name)+'</span>';
  h += '<span class="tutor-inst">'+esc(tu.institute)+'</span>';
  if(hasFullAccess()){
    h += '<span class="badge xs">学'+tu.xueShuo+'</span>';
    h += '<span class="badge zhuan">专'+tu.zhuanShuo+'</span>';
    h += '<span class="badge total">合'+tu.total+'</span>';
    if(tu.yizhiXue||tu.yizhiZhuan) h += '<span class="badge" style="background:#dbeafe;color:#1e40af">一志愿'+(tu.yizhiXue+tu.yizhiZhuan)+'</span>';
    if(tu.tiaoXue||tu.tiaoZhuan) h += '<span class="badge" style="background:#fef3c7;color:#92400e">调剂'+(tu.tiaoXue+tu.tiaoZhuan)+'</span>';
  } else {
    h += '<span class="badge" style="background:#f1f5f9;color:#94a3b8">🔒 订阅可查看</span>';
  }
  // 研究方向
  if(tu.direction) h += '<span class="tutor-role" style="background:#ede9fe;color:#5b21b6">'+esc(tu.direction)+'</span>';
  // 导师定位
  if(tu.role) h += '<span class="tutor-role">'+esc(tu.role)+'</span>';
  // 评价标签：延毕、横向项目
  if(hasFullAccess()){
    if(tu.delay) h += '<span class="badge" style="background:'+('有延毕'===tu.delay?'#fee2e2':'#dcfce1')+';color:'+('有延毕'===tu.delay?'#991b1b':'#166534')+'">'+esc(tu.delay)+'</span>';
    if(tu.horizontal) h += '<span class="badge" style="background:#e0f2fe;color:#075985">横向:'+esc(tu.horizontal)+'</span>';
  }
  // 评级理由（优先reason字段，其次field字段）
  var reason = tu.reason || '';
  if(!reason || reason==='nan' || reason==='NaN') reason = tu.field || '';
  if(reason && reason!=='nan' && reason!=='NaN') h += '<div class="tutor-reason">'+esc(reason)+'</div>';
  // 评价备注
  if(hasFullAccess() && tu.evalNote && tu.evalNote!=='nan' && tu.evalNote!=='NaN') h += '<div class="tutor-reason" style="color:#475569;font-size:12px;border-left:3px solid #cbd5e1">📝 '+esc(tu.evalNote)+'</div>';
  h += '</div>';
  return h;
}

function renderTutorList(){
  var c = $('tutorList');
  if(!c) return;
  var list = [];
  for(var i=0;i<APP_DATA.tutors.length;i++){
    var t = APP_DATA.tutors[i];
    if(tutorFilter!=='all' && t.institute!==tutorFilter) continue;
    if(tutorSearch && t.name.indexOf(tutorSearch)<0) continue;
    list.push(t);
  }
  // 按研究所分组
  var groups = {};
  var groupOrder = [];
  for(var i=0;i<list.length;i++){
    var inst = list[i].institute || '其他';
    if(!groups[inst]){ groups[inst] = []; groupOrder.push(inst); }
    groups[inst].push(list[i]);
  }
  var h = '<div class="sub-title">共 '+list.length+' 位导师 · 按研究所分组并评级排序</div>';
  if(list.length===0){ h += '<div class="empty">未找到匹配导师</div>'; }
  // 按研究所输出，所内按评级排序
  for(var gi=0;gi<groupOrder.length;gi++){
    var inst = groupOrder[gi];
    var tutors = groups[inst];
    // 按评级排序（S>A>B>C>无）
    tutors.sort(function(a,b){
      return gradePriority(a.grade) - gradePriority(b.grade);
    });
    h += '<div class="section-title" style="margin-top:16px">'+esc(inst)+'（'+tutors.length+'人）</div>';
    for(var j=0;j<tutors.length;j++){
      h += renderTutorCard(tutors[j]);
    }
  }
  c.innerHTML = h;
}

function renderWeightArea(){
  var c = $('weightArea');

    h += '<label class="switch"><input type="checkbox" '+(cfg.en?'checked':'')+' onchange="toggleField(\''+f.key+'\',this.checked)" '+(!master?'disabled':'')+'><span class="slider"></span></label>';

function updateWeight(key, val){
  if(!requireMaster()) return;
  if(!scoringConfig[key]) scoringConfig[key] = {w:10, en:true};
  scoringConfig[key].w = parseFloat(val)||0;
  updateTotalWeight();
  renderScoringList();
  renderScoringDetail();
}

function toggleField(key, en){
  if(!requireMaster()) return;
  if(!scoringConfig[key]) scoringConfig[key] = {w:10, en:true};
  scoringConfig[key].en = en;
  renderWeightArea();
  renderScoringList();
  renderScoringDetail();
}

function updateTotalWeight(){
  var c = $('totalWeight');
  if(!c) return;
  var total = 0;
  for(var i=0;i<SCORING_FIELDS.length;i++){
    var cfg = scoringConfig[SCORING_FIELDS[i].key];
    if(cfg && cfg.en) total += (cfg.w||0);
  }
  c.className = 'total-w ' + (total===100?'ok':'warn');
  c.textContent = '启用权重合计：'+total+'% ' + (total===100?'(合理)':'(建议调整为100%)');
}

function computeScore(key){
  var data = scoringData[key];
  if(!data) return null;
  var sum=0, wsum=0;
  for(var i=0;i<SCORING_FIELDS.length;i++){
    var f = SCORING_FIELDS[i];
    var cfg = scoringConfig[f.key];
    if(cfg && cfg.en){
      var v = data[f.key];
      if(v!==undefined && v!==null && v!==''){
        var s = parseFloat(v);
        if(!isNaN(s)){
          sum += s * (cfg.w||0);
          wsum += (cfg.w||0);
        }
      }
    }
  }
  if(wsum===0) return null;
  return sum / wsum;
}

// ===== CSV =====
function triggerImport(){
  if(!requireMaster()) return;
  var f=$('csvFile');
  if(f) f.click();
}

function handleCSV(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    try{ parseCSV(ev.target.result); }catch(err){ showToast('导入失败：'+err.message); }
  };
  reader.readAsText(file, 'UTF-8');
  e.target.value = '';
}

function parseCSVLine(line){
  var res=[]; var cur=''; var inQ=false;
  for(var i=0;i<line.length;i++){
    var ch=line[i];
    if(ch==='"'){
      if(inQ && line[i+1]==='"'){ cur+='"'; i++; }
      else inQ=!inQ;
    } else if(ch===',' && !inQ){ res.push(cur); cur=''; }
    else cur+=ch;
  }
  res.push(cur);
  return res;
}

function parseCSV(text){
  var lines = text.split(/\r?\n/);
  var nonEmpty = [];
  for(var i=0;i<lines.length;i++){ if(lines[i].trim()) nonEmpty.push(lines[i]); }
  if(nonEmpty.length<2){ showToast('CSV为空或格式错误'); return; }
  var headers = parseCSVLine(nonEmpty[0]);
  var idxName = -1, idxInst = -1;
  for(var i=0;i<headers.length;i++){
    var hl = headers[i].toLowerCase();
    if(idxName<0 && (headers[i].indexOf('姓名')>=0 || hl==='name')) idxName = i;
    if(idxInst<0 && (headers[i].indexOf('研究所')>=0 || headers[i].indexOf('所属')>=0 || hl==='institute')) idxInst = i;
  }
  var nameCol = idxName>=0? idxName : 0;
  var instCol = idxInst>=0? idxInst : 1;
  var count=0;
  for(var i=1;i<nonEmpty.length;i++){
    var cols = parseCSVLine(nonEmpty[i]);
    var name = (cols[nameCol]||'').trim();
    var inst = (cols[instCol]||'').trim();
    if(!name) continue;
    var key = name + '|' + inst;
    if(!scoringData[key]) scoringData[key] = {};
    for(var hi=0;hi<headers.length;hi++){
      if(hi===nameCol || hi===instCol) continue;
      var f = null;
      for(var fi=0;fi<SCORING_FIELDS.length;fi++){ if(SCORING_FIELDS[fi].label===headers[hi] || SCORING_FIELDS[fi].key===headers[hi]){ f=SCORING_FIELDS[fi]; break; } }
      if(f && cols[hi]!==undefined && cols[hi]!==''){
        var v = parseFloat(cols[hi]);
        if(!isNaN(v)) scoringData[key][f.key] = v;
      }
    }
    count++;
  }
  renderScoringList();
  renderScoringDetail();
  showToast('已导入 '+count+' 条打分记录');
}

function escapeCSV(v){
  v = String(v==null?'':v);
  if(v.indexOf(',')>=0 || v.indexOf('"')>=0 || v.indexOf('\n')>=0) return '"'+v.replace(/"/g,'""')+'"';
  return v;
}

function exportData(){
  var csv = '导师姓名,研究所,招生名额,';
  var labels = [];
  for(var i=0;i<SCORING_FIELDS.length;i++) labels.push(escapeCSV(SCORING_FIELDS[i].label));
  csv += labels.join(',');
  csv += ',加权得分\n';
  for(var i=0;i<APP_DATA.tutors.length;i++){
    var t = APP_DATA.tutors[i];
    var key = tkey(t);
    var row = [t.name, t.institute, t.total];
    for(var j=0;j<SCORING_FIELDS.length;j++){
      var f = SCORING_FIELDS[j];
      var v = scoringData[key] && scoringData[key][f.key];
      row.push(v!==undefined? v : '');
    }
    var sc = computeScore(key);
    row.push(sc!==null? sc.toFixed(2) : '');
    csv += row.map(escapeCSV).join(',') + '\n';
  }
  var blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '导师评分_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  showToast('已导出 '+APP_DATA.tutors.length+' 位导师数据');
}

// ===== 敏感数据查询密码系统 =====
// 原理：主人可生成"查询密码"，游客输入后可查看导师名额和成绩详情
// 查询密码与主密码种子相关，但独立于登录密码
var QUERY_UNLOCK_KEY = 'decision_query_unlocked';
var QUERY_DATE_KEY = 'decision_query_date';

// 生成查询密码（6位，基于种子+日期，与登录密码不同）
function getQueryPassword(){
  var raw = 'QUERY_' + SECRET_SEED + '_' + getTodayStr();
  var hash = sha256(raw);
  var code = hash.substring(0, 8);
  return code;
}

// 检查查询权限是否已解锁
function isQueryUnlocked(){
  var unlocked = sessionStorage.getItem(QUERY_UNLOCK_KEY) === '1';
  var date = sessionStorage.getItem(QUERY_DATE_KEY);
  return unlocked && date === getTodayStr();
}

// 主人查看今日查询密码
function showQueryPassword(){
  if(!isMaster()){ showToast('仅主人可查看'); return; }
  var code = getQueryPassword();
  alert('今日查询密码：' + code + '\n有效期：' + getTodayStr() + '（次日失效）\n\n将此密码发给需要查看导师名额和成绩的朋友。');
}

// 游客输入查询密码解锁
function unlockQuery(){
  var pwd = prompt('请输入查询密码（向主人获取）：');
  if(!pwd) return;
  if(pwd.trim() === getQueryPassword()){
    sessionStorage.setItem(QUERY_UNLOCK_KEY, '1');
    sessionStorage.setItem(QUERY_DATE_KEY, getTodayStr());
    showToast('查询权限已解锁');
    renderAdmission();
  } else {
    showToast('查询密码错误或已过期');
  }
}

function locateScore(val){
  var c = $('locateResult');
  if(!c) return;
  var score = parseFloat(val);
  if(!score || isNaN(score)){ c.innerHTML = ''; return; }
  var h = '';
  for(var i=0;i<APP_DATA.targets.length;i++){
    var t = APP_DATA.targets[i];
    var th = parseInt(String(t.targetScore).replace(/\D/g,'')) || 0;
    var ok = score >= th;
    var cls = ok ? 'result-good' : 'result-bad';
    h += '<div class="result-box '+cls+'">';
    h += '<div class="result-title">'+esc(t.direction)+' '+(ok?'✓ 可报':'✗ 未达目标')+'</div>';
    h += '<div class="result-detail">目标'+esc(t.targetScore)+'（专业课'+esc(t.targetCourse)+'） · 竞争'+esc(t.competition)+' · '+esc(t.suitFor)+'</div>';
    h += '</div>';
  }
  c.innerHTML = h;
}

function renderMatchList(){
  var c = $('matchList');
  if(!c) return;
  var master = isMaster();
  var dis = master ? '' : 'disabled';
  var opts = '<option value="">-- 选择导师 --</option>';
  for(var i=0;i<APP_DATA.tutors.length;i++){
    var t = APP_DATA.tutors[i];
    var k = tkey(t);
    opts += '<option value="'+esc(k)+'">'+esc(t.name)+' - '+esc(t.institute)+'</option>';
  }
  var h = '';
  if(matchData.length===0){
    h = '<div class="empty">暂无匹配记录'+(master?'，点击"+ 添加匹配"开始':'')+'</div>';
  } else {
    for(var i=0;i<matchData.length;i++){
      var m = matchData[i];
      h += '<div class="match-row">';
      h += '<input class="mn" placeholder="学生姓名" value="'+esc(m.student||'')+'" oninput="updateMatch('+i+',\'student\',this.value)" '+dis+'>';
      h += '<select class="ms" style="width:170px" onchange="updateMatch('+i+',\'tutor\',this.value)" '+dis+'>'+opts+'</select>';
      h += '<input class="mn" placeholder="备注" value="'+esc(m.note||'')+'" oninput="updateMatch('+i+',\'note\',this.value)" '+dis+'>';
      if(master) h += '<button class="match-del" onclick="delMatch('+i+')">×</button>';
      h += '</div>';
    }
  }
  c.innerHTML = h;
  var sels = c.querySelectorAll('select');
  for(var i=0;i<matchData.length;i++){
    if(matchData[i].tutor && sels[i]) sels[i].value = matchData[i].tutor;
  }
}

function addMatch(){
  if(!requireMaster()) return;
  matchData.push({student:'', tutor:'', note:''});
  renderMatchList();
  localStorage.setItem('matchData', JSON.stringify(matchData));
}

function updateMatch(i, field, val){
  if(!requireMaster()) return;
  if(!matchData[i]) return;
  matchData[i][field] = val;
  localStorage.setItem('matchData', JSON.stringify(matchData));
}

function delMatch(i){
  if(!requireMaster()) return;
  matchData.splice(i,1);
  renderMatchList();
  localStorage.setItem('matchData', JSON.stringify(matchData));
  showToast('已删除一行');
}

      var trialStatus = '';

        trialColor = '#0284c7';

        var tExp = new Date(ta.activatedAt).getTime() + ta.trialHours * 3600000;

          trialStatus = '✅ 使用中（剩余' + (hrs>0?hrs+'小时':'') + mins + '分钟）';

          trialColor = '#dc2626';
        }

      h += '<td style="padding:8px;text-align:center">' + ta.trialHours + '小时</td>';
      h += '<td style="padding:8px;text-align:center">' + (ta.activatedAt?new Date(ta.activatedAt).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'-') + '</td>';
      h += '<td style="padding:8px;text-align:center;color:' + trialColor + '">' + trialStatus + '</td>';
      h += '<td style="padding:8px;text-align:center">';
      h += '<button class="btn btn-ol" style="font-size:11px;padding:4px 8px;margin:2px;background:#0284c7;color:#fff;border-color:#0284c7" onclick="refreshTrialAccountAdmin(\''+esc(ta.username)+'\')">🔄 刷新</button>';
      h += '</td>';

      h += '<tr style="border-bottom:1px solid #f1f5f9">';
      h += '<td style="padding:8px;font-weight:600">' + esc(a.username) + '</td>';
      h += '<td style="padding:8px;text-align:center">' + (a.created?a.created.substring(0,10):'-') + '</td>';
      h += '<td style="padding:8px;text-align:center">' + (a.expiry||'永久') + '</td>';

      h += '</td>';
      h += '</tr>';
    }
    h += '</table>';
  }
  h += '</div>';
  c.innerHTML = h;
}

  showToast('已' + (newStatus==='active'?'启用':'停用') + '账号 ' + username);
}

  adminCurrentTab = tab;

function adminImportTutorsCSV(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    var text = ev.target.result;
    var content = text.charCodeAt(0)===0xFEFF ? text.slice(1) : text;
    var lines = content.split(/\r?\n/).filter(function(l){return l.trim();});
    if(lines.length<2){ alert('CSV文件内容不足'); return; }
    var headers = parseCSVLine2(lines[0]);
    function findCol(cands){
      for(var ci=0;ci<cands.length;ci++){
        for(var hi=0;hi<headers.length;hi++){
          if(headers[hi].indexOf(cands[ci])>=0 || cands[ci].indexOf(headers[hi])>=0) return hi;
        }
      }
      return -1;
    }
    var ni = findCol(['导师姓名','姓名','导师']);
    var ii = findCol(['所属所','所','学院']);
    var gi = findCol(['等级','评级','SABC']);
    var ri = findCol(['导师定位','定位','职称']);
    var xi = findCol(['学硕名额','学硕','学']);
    var zi = findCol(['专硕名额','专硕','专']);
    var di = findCol(['研究方向','方向']);
    var fi = findCol(['评级理由','评价理由','理由']);
    var dli = findCol(['延毕','延毕情况']);
    var hi2 = findCol(['横向','横向项目']);
    var eni = findCol(['评价备注','evalNote']);
    var ni2 = findCol(['备注','note','说明']);
    if(ni<0){ alert('找不到姓名列'); return; }

    var mode = confirm('点击"确定"=追加导入（保留现有导师）\n点击"取消"=完全替换（清空原有数据）');
    var newList = [];
    for(var i=1;i<lines.length;i++){
      var cols = parseCSVLine2(lines[i]);
      if(!cols[ni] || !cols[ni].trim()) continue;
      var xs = parseInt(cols[xi])||0;
      var zs = parseInt(cols[zi])||0;
      newList.push({
        name: cols[ni].trim(),
        institute: ii>=0?(cols[ii]||'').trim():'',
        grade: gi>=0?(cols[gi]||'').trim():'',
        role: ri>=0?(cols[ri]||'').trim():'',
        xueShuo: xs, zhuanShuo: zs, total: xs+zs,
        direction: di>=0?(cols[di]||'').trim():'',
        delay: dli>=0?(cols[dli]||'').trim():'',
        horizontal: hi2>=0?(cols[hi2]||'').trim():'',
        field: fi>=0?(cols[fi]||'').trim():'',
        evalNote: eni>=0?(cols[eni]||'').trim():'',
        note: ni2>=0?(cols[ni2]||'').trim():''
      });
    }
    if(mode){
      APP_DATA.tutors = APP_DATA.tutors.concat(newList);
    }else{
      APP_DATA.tutors = newList;
    }
    recalcInstitutes();
    saveAdminState();
    renderAdminTutors($('adminContent'));
    alert('导入成功！共导入 '+newList.length+' 位导师');
    e.target.value = '';
  };
  reader.readAsText(file, 'UTF-8');
}

function parseCSVLine2(line){
  var result = []; var cur = ''; var inQ = false;
  for(var i=0;i<line.length;i++){
    var ch = line[i];
    if(inQ){
      if(ch==='"'){ if(line[i+1]==='"'){ cur+='"'; i++; } else inQ = false; }
      else cur+=ch;
    }else{
      if(ch==='"') inQ = true;
      else if(ch===','){ result.push(cur); cur=''; }
      else cur+=ch;
    }
  }
  result.push(cur);
  return result;
}

// 适配函数：将 SCORING_FIELDS + scoringConfig 转换为管理后台使用的 metrics 格式
function getScoringMetrics(){
  var metrics = [];
  for(var i=0;i<SCORING_FIELDS.length;i++){
    var f = SCORING_FIELDS[i];
    var cfg = scoringConfig[f.key] || { w: f.w, en: true };
    metrics.push({
      id: f.key,
      key: f.key,
      name: f.label,
      weight: cfg.w !== undefined ? cfg.w : f.w,
      enabled: cfg.en !== undefined ? cfg.en : true,
      desc: f.desc || ''
    });
  }
  return metrics;
}

function saveScoringMetrics(metrics){
  // 将管理后台的 metrics 格式保存回 SCORING_FIELDS 和 scoringConfig
  SCORING_FIELDS = [];
  for(var i=0;i<metrics.length;i++){
    var m = metrics[i];
    var key = m.key || m.id || ('metric_'+i);
    SCORING_FIELDS.push({
      key: key,
      label: m.name,
      w: m.weight,
      desc: m.desc || ''
    });
    scoringConfig[key] = { w: m.weight, en: m.enabled !== false };
  }
  localStorage.setItem('scoringConfig', JSON.stringify(scoringConfig));
}

// 决策模块数据结构：modules数组，每个module有type, title, content/config
// type: text（文本块）、score_locator（分数定位器）、match_table（匹配表）、list（列表）

function getDecisionModules(){
  if(!APP_DATA.decisionModules){
    // 初始化默认模块
    APP_DATA.decisionModules = [
      { id: 'locator', type: 'score_locator', title: '个人分数定位器' },
      { id: 'match', type: 'match_table', title: '导师-学生匹配表' }
    ];
  }
  return APP_DATA.decisionModules;
}

function renderAdminDecision(c){
  var mods = getDecisionModules();
  var typeNames = {text:'文本模块',score_locator:'分数定位器',match_table:'匹配表',list:'列表模块'};
  c.innerHTML = '<h3>🎯 我的决策 - 模块管理 <span style="font-size:13px;color:#94a3b8;font-weight:normal">共 '+mods.length+' 个模块</span></h3>' +
    '<p style="color:#64748b;font-size:13px;margin-bottom:16px">可以自由添加、删除、排序模块。关闭管理后台后"我的决策"页面会按这里的设置显示。</p>' +
    '<div class="admin-toolbar">' +
    '<button class="btn btn-pri" onclick="addDecisionModule(\'text\')">+ 添加文本模块</button>' +
    '<button class="btn btn-pri" onclick="addDecisionModule(\'list\')">+ 添加列表模块</button>' +
    '<button class="btn btn-sec" onclick="addDecisionModule(\'score_locator\')">+ 分数定位器</button>' +
    '<button class="btn btn-sec" onclick="addDecisionModule(\'match_table\')">+ 匹配表</button>' +
    '</div>' +
    '<div id="decModuleList"></div>';

  var h = '';
  for(var i=0;i<mods.length;i++){
    var m = mods[i];
    h += '<div class="module-card">';
    h += '<div class="mc-head">';
    h += '<span class="mc-type">'+typeNames[m.type]+'</span>';
    h += '<span class="mc-title">'+esc(m.title)+'</span>';
    h += '<span class="mc-actions">';
    if(i>0) h += '<button class="at-btn at-btn-move" onclick="moveDecModule('+i+',-1)">↑上移</button>';
    if(i<mods.length-1) h += '<button class="at-btn at-btn-move" onclick="moveDecModule('+i+',1)">↓下移</button>';
    h += '<button class="at-btn at-btn-edit" onclick="editDecModule('+i+')">编辑</button>';
    if(m.type!=='score_locator' && m.type!=='match_table'){
      h += '<button class="at-btn at-btn-del" onclick="delDecModule('+i+')">删除</button>';
    }
    h += '</span></div>';
    if(m.type==='text' && m.content){
      h += '<div style="font-size:13px;color:#475569;white-space:pre-wrap">'+esc(m.content.substring(0,100))+(m.content.length>100?'...':'')+'</div>';
    }
    if(m.type==='list' && m.items){
      h += '<div style="font-size:13px;color:#475569">共 '+m.items.length+' 条列表项</div>';
    }
    h += '</div>';
  }
  $('decModuleList').innerHTML = h;
}

function addDecisionModule(type){
  var mods = getDecisionModules();
  var m = { id: 'mod_'+genAdminId(), type: type, title: '' };
  if(type==='text'){ m.title='新文本模块'; m.content='在这里输入内容...'; }
  if(type==='list'){ m.title='新列表'; m.items=['列表项1','列表项2']; }
  if(type==='score_locator'){ m.title='个人分数定位器'; }
  if(type==='match_table'){ m.title='导师-学生匹配表'; }
  mods.push(m);
  saveAdminState();
  renderAdminDecision($('adminContent'));
  showToast('已添加');
}

function editDecModule(idx){
  var mods = getDecisionModules();
  var m = mods[idx];
  if(m.type==='score_locator' || m.type==='match_table'){
    alert('此类型为系统功能模块，仅支持修改标题和上下移动');
  }
  var bodyHtml = '<div class="am-form-group"><label>模块标题</label><input id="dm_title" value="'+esc(m.title)+'"></div>';
  if(m.type==='text'){
    bodyHtml += '<div class="am-form-group"><label>内容（支持换行）</label><textarea id="dm_content" style="min-height:150px">'+esc(m.content||'')+'</textarea></div>';
  }
  if(m.type==='list'){
    bodyHtml += '<div class="am-form-group"><label>列表项（每行一个）</label><textarea id="dm_items" style="min-height:150px">'+esc((m.items||[]).join('\n'))+'</textarea></div>';
  }
  adminModal('编辑模块', bodyHtml, function(){
    m.title = $('dm_title').value.trim();
    if(m.type==='text') m.content = $('dm_content').value;
    if(m.type==='list') m.items = $('dm_items').value.split('\n').filter(function(x){return x.trim();});
    saveAdminState();
    renderAdminDecision($('adminContent'));
    closeAdminModal();
    showToast('已更新');
    return true;
  });
}

function moveDecModule(idx, dir){
  var mods = getDecisionModules();
  var ni = idx + dir;
  if(ni<0 || ni>=mods.length) return;
  var tmp = mods[idx]; mods[idx] = mods[ni]; mods[ni] = tmp;
  saveAdminState();
  renderAdminDecision($('adminContent'));
}

function delDecModule(idx){
  var mods = getDecisionModules();
  if(!confirm('确定删除「'+mods[idx].title+'」？')) return;
  mods.splice(idx,1);
  saveAdminState();
  renderAdminDecision($('adminContent'));
  showToast('已删除');
}

  var lines = [];

  var groups = {};

      var fields = [];
      if(t.grade) fields.push("grade:'"+t.grade+"'");
      if(t.role) fields.push("role:'"+t.role+"'");
      if(t.delay) fields.push("delay:'"+t.delay+"'");
      if(t.horizontal) fields.push("horizontal:'"+t.horizontal+"'");
      if(t.reason && t.reason!=='nan' && t.reason!=='NaN'){
        var r = t.reason.replace(/'/g, "\\'");
        fields.push("reason:'"+r+"'");

      if(t.evalNote){

        fields.push("evalNote:'"+n+"'");
      }
      groups[inst].push("  '"+t.tutor+"':{"+fields.join(',')+"}");
    }
  }
  var groupLines = [];
  for(var g in groups){

      groupLines.push("  // "+g);

  var code = "var TUTOR_EVAL_DATA = {\n" + groupLines.join(',\n') + "\n};";

function importAdminData(e){
  var file = e.target.files[0];
  if(!file) return;
  if(!confirm('导入将覆盖当前全部数据，确定继续？')) { e.target.value=''; return; }
  var reader = new FileReader();
  reader.onload = function(ev){
    try{
      var data = JSON.parse(ev.target.result);
      if(!data.appData) throw new Error('数据格式不正确，缺少appData');
      APP_DATA = data.appData;
      if(data.scores) scoringData = data.scores;
      if(data.matchData) matchData = data.matchData;
      if(data.scoringConfig) scoringConfig = data.scoringConfig;
      // 确保关键字段存在
      if(!APP_DATA.tutors) APP_DATA.tutors = [];
      if(!APP_DATA.overview) APP_DATA.overview = [];
      if(!APP_DATA.interview) APP_DATA.interview = {schedule:[],content:[],flow:[],tips:[]};
      if(!APP_DATA.targets) APP_DATA.targets = [];
      if(!APP_DATA.trends) APP_DATA.trends = [];
      saveAdminState();
      localStorage.setItem('scoringData', JSON.stringify(scoringData));
      localStorage.setItem('scoringConfig', JSON.stringify(scoringConfig));
      localStorage.setItem('matchData', JSON.stringify(matchData));

function downloadFile2(content, filename, type){
  var blob = new Blob([content], {type: type+';charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// 从ADMISSION_DATA获取导师的招生数据
function getTutorAdmission(tutorName, dept){
  if(typeof ADMISSION_DATA === 'undefined') return null;
  for(var i=0;i<ADMISSION_DATA.length;i++){
    if(ADMISSION_DATA[i].dept !== dept) continue;
    for(var j=0;j<ADMISSION_DATA[i].list.length;j++){
      if(ADMISSION_DATA[i].list[j].tutor === tutorName) return ADMISSION_DATA[i].list[j];
    }
  }
  return null;
}

// 获取所有导师招生数据扁平化
function getAllTutorAdmissions(){
  if(typeof ADMISSION_DATA === 'undefined') return [];
  var result = [];
  for(var i=0;i<ADMISSION_DATA.length;i++){
    for(var j=0;j<ADMISSION_DATA[i].list.length;j++){
      var t = ADMISSION_DATA[i].list[j];
      var scores = [];
      var yizhi = 0, tiaoji = 0;
      for(var k=0;k<t.students.length;k++){
        var s = t.students[k];
        if(s.total) scores.push(s.total);
        if(s.src === '一志愿') yizhi++;
        else if(s.src === '调剂') tiaoji++;
      }
      result.push({
        tutor: t.tutor, dept: ADMISSION_DATA[i].dept,
        xue: t.xue, zhuan: t.zhuan, total: t.total,
        students: t.students, scores: scores,
        avg: scores.length ? scores.reduce(function(a,b){return a+b;},0)/scores.length : 0,
        min: scores.length ? Math.min.apply(null,scores) : 0,
        max: scores.length ? Math.max.apply(null,scores) : 0,
        yizhi: yizhi, tiaoji: tiaoji,
        studentCount: t.students.length
      });
    }
  }
  return result;
}

// 智能推荐核心算法
function runRecommendation(){
  var score = parseInt(recState.score);
  if(!score || score < 0 || score > 500){
    showToast('请输入有效总分（0-500）');
    return;
  }
  var cat = recState.cat; // '学硕'/'专硕'/''
  var dir = recState.dir; // '材料科学基础/材料科学与工程'/'高分子'/''
  var pref = recState.pref;
  var all = getAllTutorAdmissions();
  var results = [];

  for(var i=0;i<all.length;i++){
    var t = all[i];
    // 方向过滤（容错：不选就全显示）
    if(cat){
      var tCat = t.xue > 0 && t.zhuan === 0 ? '学硕' : (t.zhuan > 0 && t.xue === 0 ? '专硕' : 'both');
      if(cat === '学硕' && t.xue === 0) continue;
      if(cat === '专硕' && t.zhuan === 0) continue;
    }
    // 方向过滤（容错：不选就全显示）
    if(dir){
      var hasDir = false;
      for(var k=0;k<t.students.length;k++){
        if(t.students[k].cat === cat || !cat){
          if(t.students[k].方向 === dir || t.students[k].direction === dir){ hasDir = true; break; }
        }
      }
      // 如果学生没有方向字段，按所名判断
      if(!hasDir){
        if(dir === '高分子' && t.dept.indexOf('高分子') >= 0) hasDir = true;
        else if(dir !== '高分子' && t.dept.indexOf('高分子') < 0) hasDir = true;
      }
      if(!hasDir) continue;
    }

    // 计算匹配等级（大容错）
    var tier, tierColor, reason;
    if(t.scores.length === 0){
      tier = 'green'; tierColor = 'tier-green'; reason = '该导师无成绩数据，建议联系确认';
    } else if(score >= t.avg + 10){
      tier = 'green'; tierColor = 'tier-green';
      reason = '你的分数高于该导师平均分' + (score - t.avg).toFixed(0) + '分，录取概率很高';
    } else if(score >= t.avg){
      tier = 'green'; tierColor = 'tier-green';
      reason = '你的分数达到该导师平均分水平，录取较稳';
    } else if(score >= t.avg - 10){
      tier = 'yellow'; tierColor = 'tier-yellow';
      reason = '你的分数接近平均分（差' + (t.avg - score).toFixed(0) + '分），有较好机会';
    } else if(score >= t.min){
      tier = 'orange'; tierColor = 'tier-orange';
      reason = '你的分数在该导师录取最低分以上，可以冲刺';
    } else if(score >= t.min - 15){
      tier = 'orange'; tierColor = 'tier-orange';
      reason = '你的分数略低于最低录取分' + (t.min - score).toFixed(0) + '分，仍有机会，建议联系导师';
    } else {
      tier = 'red'; tierColor = 'tier-red';
      reason = '你的分数低于该导师最低录取分' + (t.min - score).toFixed(0) + '分，风险较大但非绝对';
    }

    // 偏好加权
    var prefBonus = 0;
    if(pref === 'many' && t.total >= 3) prefBonus = 1;
    if(pref === 'few' && t.total <= 2) prefBonus = 1;
    if(pref === 'safe' && (tier === 'green' || tier === 'yellow')) prefBonus = 1;
    if(pref === 'reach' && (tier === 'orange' || tier === 'red')) prefBonus = 1;

    results.push({
      data: t, tier: tier, tierColor: tierColor, reason: reason, prefBonus: prefBonus,
      matchScore: score - t.avg + prefBonus * 5
    });
  }

  // 排序：按等级优先（green > yellow > orange > red），再按分数接近度
  var tierOrder = { green: 0, yellow: 1, orange: 2, red: 3 };
  results.sort(function(a,b){
    if(tierOrder[a.tier] !== tierOrder[b.tier]) return tierOrder[a.tier] - tierOrder[b.tier];
    if(a.prefBonus !== b.prefBonus) return b.prefBonus - a.prefBonus;
    return Math.abs(a.matchScore) - Math.abs(b.matchScore);
  });

  renderRecResults(results, score);
}

function renderCompareView(){
  var c = $('recResults');
  if(!c) return;
  if(compareList.length < 2){
    c.innerHTML = '<div class="card"><div style="padding:20px;text-align:center;color:#94a3b8">请至少选择2位导师进行对比</div></div>';

  }
  var h = '<div class="card"><div class="card-title">📊 导师对比</div>';
  h += '<table class="cmp-table"><thead><tr><th>对比项</th>';
  for(var i=0;i<compareList.length;i++){
    var parts = compareList[i].split('@');
    h += '<th>' + esc(parts[0]) + '<br><span style="font-size:11px;color:#64748b;font-weight:400">' + esc(parts[1]) + '</span></th>';
  }
  h += '</tr></thead><tbody>';

  var rows = [
    ['学硕名额','xue'],
    ['专硕名额','zhuan'],
    ['总名额','total'],
    ['录取人数','studentCount'],
    ['一志愿人数','yizhi'],
    ['调剂人数','tiaoji'],
    ['平均分','avg'],
    ['最低分','min'],
    ['最高分','max']
  ];

  for(var r=0;r<rows.length;r++){
    h += '<tr><td>' + rows[r][0] + '</td>';
    for(var i=0;i<compareList.length;i++){
      var parts = compareList[i].split('@');
      var t = getTutorAdmission(parts[0], parts[1]);
      if(!t){ h += '<td>-</td>'; continue; }
      var scores = [];
      var yizhi=0, tiaoji=0;
      for(var k=0;k<t.students.length;k++){
        if(t.students[k].total) scores.push(t.students[k].total);
        if(t.students[k].src==='一志愿') yizhi++;
        else if(t.students[k].src==='调剂') tiaoji++;
      }
      var avg = scores.length ? (scores.reduce(function(a,b){return a+b;},0)/scores.length).toFixed(1) : '-';
      var mn = scores.length ? Math.min.apply(null,scores) : '-';
      var mx = scores.length ? Math.max.apply(null,scores) : '-';
      var val = rows[r][1];
      if(val==='xue') h += '<td>' + (t.xue||'-') + '</td>';
      else if(val==='zhuan') h += '<td>' + (t.zhuan||'-') + '</td>';
      else if(val==='total') h += '<td>' + (t.xue+t.zhuan) + '</td>';
      else if(val==='studentCount') h += '<td>' + t.students.length + '</td>';
      else if(val==='yizhi') h += '<td>' + yizhi + '</td>';
      else if(val==='tiaoji') h += '<td>' + tiaoji + '</td>';
      else if(val==='avg') h += '<td>' + avg + '</td>';
      else if(val==='min') h += '<td>' + mn + '</td>';
      else if(val==='max') h += '<td>' + mx + '</td>';
    }
    h += '</tr>';
  }
  h += '</tbody></table>';
  h += '<div style="margin-top:12px"><button class="btn btn-ol" onclick="compareList=[];renderDecision()">清空对比列表</button></div>';
  h += '</div>';
  c.innerHTML = h;
}

// ===== 成绩可视化图表（SVG柱状图）=====
function renderScoreChart(tutorName, dept, userScore){
  var t = getTutorAdmission(tutorName, dept);
  if(!t){ showToast('未找到该导师数据'); return; }

  var students = t.students.filter(function(s){ return s.total; });
  if(students.length === 0){ showToast('该导师无成绩数据'); return; }

  students.sort(function(a,b){ return a.total - b.total; });

  // SVG参数
  var margin = { top: 30, right: 30, bottom: 60, left: 50 };
  var width = Math.max(400, students.length * 60);
  var height = 320;
  var chartW = width - margin.left - margin.right;
  var chartH = height - margin.top - margin.bottom;

  var minScore = Math.min.apply(null, students.map(function(s){ return s.total; }));
  var maxScore = Math.max.apply(null, students.map(function(s){ return s.total; }));
  var yMin = Math.floor((minScore - 20) / 10) * 10;
  var yMax = Math.ceil((maxScore + 20) / 10) * 10;
  if(userScore){ yMin = Math.min(yMin, Math.floor((userScore-20)/10)*10); yMax = Math.max(yMax, Math.ceil((userScore+20)/10)*10); }
  var yRange = yMax - yMin;
  if(yRange < 50) yRange = 50;

  var barW = Math.min(40, chartW / students.length * 0.7);
  var gap = chartW / students.length;

  function yScale(v){ return margin.top + chartH - ((v - yMin) / yRange) * chartH; }

  var h = '<div class="chart-container">';
  h += '<div style="font-size:15px;font-weight:700;margin-bottom:8px">' + esc(tutorName) + ' - 2026级录取成绩分布</div>';
  h += '<div style="overflow-x:auto"><svg width="' + width + '" height="' + height + '" xmlns="http://www.w3.org/2000/svg">';

  // Y轴刻度
  for(var v = yMin; v <= yMax; v += 10){
    var y = yScale(v);
    h += '<line x1="' + margin.left + '" y1="' + y + '" x2="' + (width - margin.right) + '" y2="' + y + '" stroke="#e2e8f0" stroke-width="1"/>';
    h += '<text x="' + (margin.left - 8) + '" y="' + (y + 4) + '" text-anchor="end" class="chart-label">' + v + '</text>';
  }

  // 平均线
  var avgScore = students.reduce(function(a,b){ return a + b.total; }, 0) / students.length;
  var avgY = yScale(avgScore);
  h += '<line x1="' + margin.left + '" y1="' + avgY + '" x2="' + (width - margin.right) + '" y2="' + avgY + '" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,3"/>';
  h += '<text x="' + (width - margin.right) + '" y="' + (avgY - 5) + '" text-anchor="end" fill="#2563eb" font-size="11" font-weight="600">平均 ' + avgScore.toFixed(1) + '</text>';

  // 用户分数线
  if(userScore){
    var uy = yScale(userScore);
    h += '<line x1="' + margin.left + '" y1="' + uy + '" x2="' + (width - margin.right) + '" y2="' + uy + '" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4"/>';
    h += '<text x="' + margin.left + '" y="' + (uy - 5) + '" text-anchor="start" fill="#f59e0b" font-size="11" font-weight="600">你的分数 ' + userScore + '</text>';
  }

  // 柱子
  for(var i = 0; i < students.length; i++){
    var s = students[i];
    var x = margin.left + i * gap + (gap - barW) / 2;
    var y = yScale(s.total);
    var barHeight = margin.top + chartH - y;
    var color = s.src === '一志愿' ? '#3b82f6' : '#f59e0b';
    h += '<rect class="chart-bar" x="' + x + '" y="' + y + '" width="' + barW + '" height="' + barHeight + '" fill="' + color + '" rx="3">';
    h += '<title>' + esc(s.n) + ' | ' + s.total + '分 | ' + s.src + '</title>';
    h += '</rect>';
    h += '<text x="' + (x + barW/2) + '" y="' + (y - 5) + '" text-anchor="middle" class="chart-label" font-weight="600">' + s.total + '</text>';
    // X轴标签
    h += '<text x="' + (x + barW/2) + '" y="' + (margin.top + chartH + 18) + '" text-anchor="middle" class="chart-label">' + esc(s.n.substring(0,3)) + '</text>';
  }

  // X轴
  h += '<line x1="' + margin.left + '" y1="' + (margin.top + chartH) + '" x2="' + (width - margin.right) + '" y2="' + (margin.top + chartH) + '" stroke="#94a3b8" stroke-width="1"/>';

  h += '</svg></div>';

  // 图例
  h += '<div class="chart-legend">';
  h += '<div class="chart-legend-item"><div class="chart-legend-color" style="background:#3b82f6"></div>一志愿</div>';
  h += '<div class="chart-legend-item"><div class="chart-legend-color" style="background:#f59e0b"></div>调剂</div>';
  h += '<div class="chart-legend-item"><div class="chart-legend-color" style="background:transparent;border:2px dashed #2563eb"></div>平均分线</div>';
  if(userScore) h += '<div class="chart-legend-item"><div class="chart-legend-color" style="background:transparent;border:2px dashed #f59e0b"></div>你的分数</div>';
  h += '</div>';

  // 详细数据表
  h += '<details style="margin-top:12px"><summary style="cursor:pointer;font-size:13px;color:#475569;font-weight:600">查看详细成绩表</summary>';
  h += '<table style="width:100%;border-collapse:collapse;font-size:12px;margin-top:8px"><tr style="background:#f1f5f9"><th style="padding:6px">姓名</th><th style="padding:6px">来源</th><th style="padding:6px">总分</th><th style="padding:6px">外语</th><th style="padding:6px">政治</th><th style="padding:6px">业务课1</th><th style="padding:6px">业务课2</th></tr>';
  for(var i = 0; i < students.length; i++){
    var s = students[i];
    h += '<tr style="border-bottom:1px solid #f1f5f9"><td style="padding:4px;text-align:center">' + esc(s.n) + '</td><td style="padding:4px;text-align:center">' + (s.src==='一志愿'?'<span style="color:#3b82f6">一志愿</span>':'<span style="color:#f59e0b">调剂</span>') + '</td><td style="padding:4px;text-align:center;font-weight:700">' + s.total + '</td><td style="padding:4px;text-align:center">' + (s.eng||'-') + '</td><td style="padding:4px;text-align:center">' + (s.pol||'-') + '</td><td style="padding:4px;text-align:center">' + (s.s1||'-') + '</td><td style="padding:4px;text-align:center">' + (s.s2||'-') + '</td></tr>';
  }
  h += '</table></details>';

  h += '</div>';

  // 弹窗显示
  openModal(tutorName + ' - 成绩可视化', h);
}

// ===== 全局搜索 =====
function onGlobalSearch(query){
  var box = $('searchResults');
  if(!box) return;
  query = (query||'').trim();
  if(!query || query.length < 1){ box.style.display = 'none'; return; }
  var all = getAllTutorAdmissions();
  var matches = [];
  for(var i=0;i<all.length;i++){
    var t = all[i];
    if(t.tutor.indexOf(query) >= 0 || t.dept.indexOf(query) >= 0){
      matches.push(t);
    }
  }
  if(matches.length === 0){
    box.innerHTML = '<div class="search-item" style="color:#94a3b8">未找到相关结果</div>';
    box.style.display = 'block';
    return;
  }
  var h = '';
  for(var i=0;i<Math.min(matches.length, 20);i++){
    var t = matches[i];
    h += '<div class="search-item" onclick="jumpToTutor(\''+esc(t.tutor)+'\',\''+esc(t.dept)+'\')">';
    h += '<div class="si-name">' + esc(t.tutor) + '</div>';
    h += '<div class="si-sub">' + esc(t.dept) + ' · 学' + (t.xue||0) + '/专' + (t.zhuan||0) + ' · 录取' + t.studentCount + '人';
    if(t.scores.length) h += ' · 平均' + t.avg.toFixed(0);
    h += '</div></div>';
  }
  if(matches.length > 20) h += '<div class="search-item" style="color:#94a3b8;text-align:center">还有 ' + (matches.length-20) + ' 条结果...</div>';
  box.innerHTML = h;
  box.style.display = 'block';
}

// ===== 从招生数据重建导师名额 =====
function rebuildTutorsFromAdmission(){
  if(typeof ADMISSION_DATA === 'undefined' || !ADMISSION_DATA || !ADMISSION_DATA.length) return;
  // 保存旧的评级等字段
  var oldMap = {};
  if(APP_DATA.tutors){
    for(var i=0;i<APP_DATA.tutors.length;i++){
      var ot = APP_DATA.tutors[i];
      var key = ot.name + '|' + ot.institute;
      oldMap[key] = { grade: ot.grade, role: ot.role, reason: ot.reason, field: ot.field, delay: ot.delay, horizontal: ot.horizontal, evalNote: ot.evalNote, direction: ot.direction };
    }
  }
  // 从ADMISSION_DATA重建
  var newTutors = [];
  for(var di=0;di<ADMISSION_DATA.length;di++){
    var dd = ADMISSION_DATA[di];
    var dept = dd.dept;
    for(var ti=0;ti<dd.list.length;ti++){
      var t = dd.list[ti];
      var yizhiXue=0, yizhiZhuan=0, tiaoXue=0, tiaoZhuan=0;
      for(var si=0;si<t.students.length;si++){
        var s = t.students[si];
        if(s.src==='一志愿'){ if(s.cat==='学硕') yizhiXue++; else yizhiZhuan++; }
        else if(s.src==='调剂'){ if(s.cat==='学硕') tiaoXue++; else tiaoZhuan++; }
      }
      var noteParts = [];
      if(t.xue) noteParts.push('学硕'+t.xue);
      if(t.zhuan) noteParts.push('专硕'+t.zhuan);
      var note = noteParts.join('、');
      if(yizhiXue||yizhiZhuan) note += ' (一志愿'+(yizhiXue+yizhiZhuan)+')';
      if(tiaoXue||tiaoZhuan) note += ' (调剂'+(tiaoXue+tiaoZhuan)+')';
      var entry = {
        name: t.tutor,
        institute: dept,
        xueShuo: t.xue,
        zhuanShuo: t.zhuan,
        total: t.total,
        yizhiXue: yizhiXue,
        yizhiZhuan: yizhiZhuan,
        tiaoXue: tiaoXue,
        tiaoZhuan: tiaoZhuan,
        note: note,
        studentCount: t.students.length
      };
      // 尝试匹配旧评级（先按名字+所匹配，再只按名字匹配）
      var k2 = t.tutor + '|' + dept;
      var old = oldMap[k2];
      if(!old){
        for(var ok in oldMap){
          if(ok.indexOf(t.tutor+'|')===0){ old = oldMap[ok]; break; }
        }
      }
      // 从查找表添加研究方向
      var dir = TUTOR_DIRECTIONS[t.tutor];
      if(dir) entry.direction = dir;
      // 从基准评价数据表加载（硬编码数据，部署后所有访客可见）
      var baseEval = TUTOR_EVAL_DATA[t.tutor];
      if(baseEval){
        if(baseEval.grade) entry.grade = baseEval.grade;
        if(baseEval.role) entry.role = baseEval.role;
        if(baseEval.delay) entry.delay = baseEval.delay;
        if(baseEval.horizontal) entry.horizontal = baseEval.horizontal;
        if(baseEval.reason) entry.reason = baseEval.reason;
        if(baseEval.evalNote) entry.evalNote = baseEval.evalNote;
        if(baseEval.direction) entry.direction = baseEval.direction;
      }
      // 保留旧评价数据（用户手动编辑的 localStorage 数据优先级最高）
      if(old){
        if(old.grade) entry.grade = old.grade;
        if(old.role) entry.role = old.role;
        if(old.reason && old.reason!=='nan' && old.reason!=='NaN') entry.reason = old.reason;
        if(old.field) entry.field = old.field;
        if(old.delay) entry.delay = old.delay;
        if(old.horizontal) entry.horizontal = old.horizontal;
        if(old.evalNote) entry.evalNote = old.evalNote;
        if(old.direction) entry.direction = old.direction;
      }
      newTutors.push(entry);
    }
  }
  APP_DATA.tutors = newTutors;
  // 重新计算各所统计
  recalcInstitutes();
}

// 重新 recalcInstitutes（如果函数不存在就创建一个）
function recalcInstitutes(){
  if(!APP_DATA.tutors) return;
  var inst = {};
  for(var i=0;i<APP_DATA.tutors.length;i++){
    var t = APP_DATA.tutors[i];
    var name = t.institute || '其他';
    if(!inst[name]) inst[name] = {count:0,xueShuo:0,zhuanShuo:0,total:0};
    inst[name].count++;
    inst[name].xueShuo += t.xueShuo||0;
    inst[name].zhuanShuo += t.zhuanShuo||0;
    inst[name].total += t.total||0;
  }
  APP_DATA.institutes = inst;
}

        var local = JSON.parse(localStorage.getItem(ACCOUNTS_KEY) || '[]');
        d.accounts.forEach(function(scf){
          var la = local.find(function(a){return a.username.toLowerCase()===scf.username.toLowerCase();});
          if(la){
            la.status = scf.status === 'active' ? 'active' : 'disabled';
            if(scf.activatedAt) la.activatedAt = scf.activatedAt;
            else if(scf.trialStatus === 'not_activated') la.activatedAt = null;
            if(scf.trialHours !== undefined) la.trialHours = scf.trialHours;
          }
        });
        localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(local));
      }catch(e){}
    }
    if(callback) callback();
  }).catch(function(){
    if(callback) callback();
  });
}

// Sync account status from SCF on page load
if(typeof window.bootApp === 'function'){
  var __origBootApp = window.bootApp;
  window.bootApp = function(){
    __origBootApp();
    var token = sessionStorage.getItem('scf_token');
    if(token && sessionStorage.getItem(LOCK_SESSION_KEY) === '1'){
      window.__SCF_TOKEN = token;
      syncAccountsFromSCF(function(){
        if(typeof renderAdminAccounts === 'function' && typeof isMaster === 'function' && isMaster()){
          renderAdminAccounts();
        }
      });
    }
  };
}
</script>
